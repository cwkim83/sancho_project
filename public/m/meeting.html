<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>산초 · 회의실·회의록</title>
<link rel="stylesheet" href="/m/platform.css">
<script src="/m/sdb.js"></script>
<style>
/* 세종 플랫폼 modules/meeting/meeting.html 의 CSS 를 옮기고 색은 전부 변수로 */
.content-pad { display: flex; flex-direction: column; min-height: 100%; }
.mod-head .acts { display: flex; gap: 8px; flex-wrap: wrap; }
/* 회의실 상태 카드 */
.room-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 14px; }
.room-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 13px; cursor: pointer; transition: border-color .12s; box-shadow: var(--shadow); }
.room-card:hover { border-color: var(--primary); }
.room-card.on { border-color: var(--primary); outline: 1px solid var(--primary); outline-offset: -1px; background: var(--primary-lighter); }
.room-card .rn { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 7px; }
.room-card .rn small { color: var(--text-lighter); font-weight: 500; font-size: 11px; }
.room-card .st { font-size: 11.5px; margin-top: 5px; color: var(--text-light); line-height: 1.5; }
.room-card .st b.busy { color: var(--danger); font-weight: 600; } .room-card .st b.free { color: var(--success); font-weight: 600; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--primary); }
.dot.green, .rblk.green { background: var(--success); } .dot.orange, .rblk.orange { background: var(--warning); } .dot.red, .rblk.red { background: var(--danger); }
.dot.purple, .rblk.purple { background: var(--purple); } .dot.gray, .rblk.gray { background: var(--text-lighter); }
/* 주간 그리드 */
.wk-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.wk-nav .ttl { font-size: 15px; font-weight: 800; margin-left: 6px; }
.wk-nav .lg { font-size: 11px; color: var(--text-light); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.wk-nav .lg span { display: inline-flex; align-items: center; gap: 4px; }
.grid-wrap { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; box-shadow: var(--shadow); }
.wk-grid { display: grid; grid-template-columns: 52px repeat(7, minmax(120px, 1fr)); min-width: 900px; }
.wk-grid .gh { position: sticky; top: 0; background: var(--bg2); border-bottom: 2px solid var(--border); padding: 7px 4px; text-align: center; font-size: 11px; font-weight: 700; color: var(--text-light); z-index: 3; border-left: 1px solid var(--border-light); }
.wk-grid .gh.today { background: var(--primary-light); color: var(--primary); }
.wk-grid .gh .dd { font-size: 14px; }
.timecol { border-left: none !important; }
.tlab { height: 26px; font-size: 9.5px; color: var(--text-lighter); text-align: right; padding-right: 5px; border-top: 1px solid var(--border-light); line-height: 1; }
.daycol { position: relative; border-left: 1px solid var(--border-light); }
.slotbg { height: 26px; border-top: 1px solid var(--border-light); cursor: pointer; }
.slotbg:nth-child(even) { border-top-style: dashed; }
.slotbg:hover { background: var(--primary-lighter); }
.rblk { position: absolute; border-radius: 4px; font-size: 9.5px; color: #fff; padding: 2px 4px; overflow: hidden; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.15); line-height: 1.25; z-index: 2; background: var(--primary); }
.rblk:hover { filter: brightness(1.08); z-index: 4; }
.rblk.done { opacity: .55; }
.rblk .bt { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rblk .bw { opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 9px; }
.nowline { position: absolute; left: 0; right: 0; height: 2px; background: var(--danger); z-index: 3; pointer-events: none; }
.nowline::before { content: ''; position: absolute; left: -3px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
.hint { font-size: 11.5px; color: var(--text-lighter); margin-top: 8px; }
/* 회의록 탭 */
.mm-wrap { display: flex; gap: 14px; flex: 1; min-height: 0; }
.mm-list { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
.mm-item { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; cursor: pointer; transition: border-color .12s; }
.mm-item:hover { border-color: var(--primary); }
.mm-item.on { border-color: var(--primary); outline: 1.5px solid var(--primary); outline-offset: -1px; background: var(--primary-lighter); }
.mm-item .t { font-weight: 700; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mm-item .m { font-size: 11px; color: var(--text-light); margin-top: 3px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mm-main { flex: 1; min-width: 0; }
.ed-head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.ed-head .ttl { font-size: 16px; font-weight: 800; }
.ed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.ed-grid .fg, .ed-one .fg { margin-bottom: 0; }
.ed-one { margin-bottom: 10px; }
.ag-blk { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; background: var(--bg2); }
.ag-blk .ag-t { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
.ag-blk .ag-t b { flex-shrink: 0; }
.ag-blk .ft { min-height: 48px; margin-bottom: 6px; background: var(--white); }
.act-row { display: flex; gap: 5px; margin-bottom: 5px; align-items: center; }
.act-row .fi { background: var(--white); }
.act-row .w { width: 110px; flex-shrink: 0; } .act-row .d { width: 140px; flex-shrink: 0; }
.act-row .fi[type=checkbox] { width: 16px; height: 16px; padding: 0; flex: none; }
.act-row.done .fi[data-ed="act-text"] { text-decoration: line-through; color: var(--text-light); }
/* 녹음 */
.rec-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rec-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--danger); animation: blink 1.1s infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
.rec-timer { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tr-box { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; height: 340px; overflow-y: auto; font-size: 13.5px; line-height: 1.7; margin-top: 12px; }
.tr-box .ts { color: var(--text-lighter); font-size: 10.5px; margin-right: 7px; font-variant-numeric: tabular-nums; }
.tr-box .interim { color: var(--text-light); font-style: italic; }
.tr-box .hint { color: var(--text-lighter); font-style: italic; }
/* 회의실 관리 */
.rm-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
.rm-row .n { flex: 2; } .rm-row .c { width: 70px; flex: none; } .rm-row .e { flex: 2; } .rm-row .k { width: 90px; flex: none; }
/* 인쇄 */
#printView { display: none; font-size: 13px; color: #000; }
#printView h1 { font-size: 20px; margin-bottom: 8px; } #printView h2 { font-size: 15px; margin: 14px 0 6px; }
#printView table { width: 100%; border-collapse: collapse; margin-bottom: 8px; } #printView th, #printView td { border: 1px solid #999; padding: 5px 8px; text-align: left; vertical-align: top; }
#printView th { background: #eee; width: 90px; }
@media print { body > *:not(#printView) { display: none !important; } #printView { display: block; padding: 10mm; } }
@media (max-width: 900px) { .mm-wrap { flex-direction: column; } .mm-list { width: auto; } .ed-grid { grid-template-columns: 1fr; } }
</style>
</head><body><div class="content-pad" id="root">
  <div class="mod-head">
    <div><div class="mod-title">회의실 · 회의록</div><div class="mod-sub" id="sub">회의실 주간 예약표와 회의록 — 녹음하면 실시간으로 글자가 올라오고, 산초가 회의록을 정리합니다</div></div>
    <div class="acts">
      <button class="btn btn-ai" data-a="askGeneral">✳ 산초에게 시키기</button>
      <button class="btn" data-a="roomsMgr">회의실 관리</button>
      <button class="btn btn-primary" data-a="newResvBtn">+ 회의실 예약</button>
    </div>
  </div>
  <div class="tabs"><div class="tab on" id="tabRooms" data-a="tab" data-v="rooms">회의실 예약</div><div class="tab" id="tabMinutes" data-a="tab" data-v="minutes">회의록</div></div>
  <div id="pane" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
</div>
<datalist id="dlUsers"></datalist>
<div class="overlay" id="ov"><div class="modal" id="mdl"></div></div>
<div id="printView"></div>
<div class="toast" id="toast"></div>
<script>
const { db, doc, collection, getDoc, getDocs, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot, query, where, orderBy, limit, writeBatch } = window.fb;
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = (t, kind = '') => { const el = document.getElementById('toast'); el.textContent = t; el.className = 'toast on ' + kind; clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2200); };
window.addEventListener('message', (e) => { if (e.data?.sancho && e.data.act === 'theme') document.documentElement.dataset.theme = e.data.theme || ''; });
let me = null;                                  // 주인(단일 사용자): {uid:'owner', name, title, dept, email}
window.fb.me().then((u) => { me = u; boot(); });

// ═══════════════ 상수 ═══════════════
const DAY_S = 8 * 60, DAY_E = 19 * 60, SLOT = 30, PXMIN = 26 / 30;   // 08:00~19:00, 30분 = 26px
const STATUS = { '예약': 'blue', '진행': 'orange', '완료': 'green', '취소': 'gray' };
const COLORS = ['blue', 'green', 'purple', 'orange', 'red', 'gray'];
const SEED_ROOMS = [
  { id: 'roomA', name: '회의실 A', capacity: 10, equipment: ['TV', '화이트보드'], color: 'blue', order: 1 },
  { id: 'roomB', name: '회의실 B', capacity: 6, equipment: ['화이트보드'], color: 'green', order: 2 },
  { id: 'roomC', name: '회의실 C', capacity: 4, equipment: [], color: 'purple', order: 3 },
];
const qs = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);

// ═══════════════ 상태 ═══════════════
let S = { tab: 'rooms', weekOff: 0, room: 'all', q: '', rooms: [], meetings: [], users: [], projects: [], sel: null, isNew: false, modal: null };
try { if (localStorage.meeting_tab === 'minutes') S.tab = 'minutes'; } catch {}
let EDITING = false;   // 편집 중엔 onSnapshot 이 와도 편집 사본을 덮지 않는다
let REC = { on: false, paused: false, startAt: 0, elapsed: 0, lines: [], interim: '', recog: null, media: null, chunks: [], audioUrl: '', audioFor: '', timer: null, meta: null };

// ═══════════════ 도우미 ═══════════════
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const hm = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const m2t = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const t2m = (t) => { const [a, b] = String(t || '0:0').split(':').map(Number); return (a || 0) * 60 + (b || 0); };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const roomOf = (id) => S.rooms.find((r) => r.id === id) || { id, name: id ? '기타' : '장소 미정', color: 'gray' };
const colorCls = (c) => COLORS.includes(c) ? c : 'blue';
const userOf = (id) => S.users.find((u) => u.id === id);
const userName = (v) => { if (!v) return ''; const u = userOf(v); if (u) return u.name + (u.title ? ' ' + u.title : ''); if (v === 'owner' && me) return me.name + (me.title ? ' ' + me.title : ''); return String(v); };
const userIdByName = (name) => { const n = String(name || '').trim(); if (!n) return ''; const u = S.users.find((x) => x.name === n || (x.name + ' ' + (x.title || '')).trim() === n); return u ? u.id : (me && n.startsWith(me.name) ? 'owner' : n); };
const projName = (id) => { const p = S.projects.find((x) => x.id === id); return p ? `${p.code ? p.code + ' ' : ''}${p.name || ''}`.trim() : ''; };
const pill = (s) => `<span class="b-pill ${STATUS[s] || 'gray'}">${esc(s || '예약')}</span>`;
const fmtEl = (s) => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return (h ? pad(h) + ':' : '') + pad(m) + ':' + pad(ss); };
const attList = (v) => Array.isArray(v) ? v : String(v || '').split(',').map((s) => s.trim()).filter(Boolean);
const hasMinutes = (m) => { const mm = m.minutes || {}; return !!(mm.topic || mm.summary || (Array.isArray(mm.agendas) && mm.agendas.some((a) => a.title || a.discussion || a.decision || (a.actions || []).length))); };
const active = (m) => m.status !== '취소';
function ensureMin(m) {   // 두뇌가 쓴 문서엔 필드가 없을 수 있다 — 편집 사본을 규격 모양으로 채운다
  m.minutes = m.minutes && typeof m.minutes === 'object' ? m.minutes : {};
  m.minutes.topic = m.minutes.topic ?? ''; m.minutes.summary = m.minutes.summary ?? '';
  m.minutes.agendas = (Array.isArray(m.minutes.agendas) ? m.minutes.agendas : []).map((a) => ({ ...a, title: a.title ?? '', discussion: a.discussion ?? '', decision: a.decision ?? '',
    actions: (Array.isArray(a.actions) ? a.actions : []).map((x) => ({ ...x, text: x.text ?? '', who: x.who ?? '', due: x.due ?? '', done: !!x.done })) }));
  m.attendees = attList(m.attendees); m.title = m.title ?? ''; m.agenda = m.agenda ?? ''; m.transcript = m.transcript ?? ''; m.status = m.status || '예약';
  return m;
}
function weekDays() {
  const d = new Date(); const wd = (d.getDay() + 6) % 7; const mon = new Date(d); mon.setDate(d.getDate() - wd + S.weekOff * 7);
  return Array.from({ length: 7 }, (_, i) => { const x = new Date(mon); x.setDate(mon.getDate() + i); return { date: ymd(x), label: '월화수목금토일'[i], dd: x.getDate(), mm: x.getMonth() + 1 }; });
}

// ═══════════════ 시작: 회의실 씨앗 + 구독 ═══════════════
async function boot() {
  try { const rs = await getDocs(collection(db, 'rooms')); if (rs.empty) for (const r of SEED_ROOMS) { const { id, ...d } = r; await setDoc(doc(db, 'rooms', id), d); } } catch (e) { console.warn('rooms seed', e); }
  const rows = (s) => s.docs.map((d) => ({ id: d.id, ...d.data() }));
  onSnapshot(collection(db, 'rooms'), (s) => { S.rooms = rows(s).sort((a, b) => (a.order ?? 99) - (b.order ?? 99) || String(a.name).localeCompare(String(b.name))); render({ soft: true }); aiPrefill(); });
  onSnapshot(collection(db, 'meetings'), (s) => {
    S.meetings = rows(s).filter((m) => m && typeof m === 'object');
    if (S.sel && !EDITING && !S.isNew) { const f = S.meetings.find((m) => m.id === S.sel.id); if (f) S.sel = ensureMin(JSON.parse(JSON.stringify(f))); }
    render({ soft: true });
  });
  onSnapshot(collection(db, 'users'), (s) => { S.users = rows(s).filter((u) => u.active !== false); $('dlUsers').innerHTML = S.users.map((u) => `<option value="${esc(u.name)}">`).join(''); render({ soft: true }); });
  onSnapshot(collection(db, 'projects'), (s) => { S.projects = rows(s).filter((p) => !p.hidden).sort((a, b) => String(a.code || '').localeCompare(String(b.code || ''))); render({ soft: true }); });
}
// AI 비서(산초) 프리필 — ?aiPrefill=<json> 이 오면 예약 모달을 열고 값만 채운다. 저장은 사람이 누른다.
let prefilled = false;
function aiPrefill() {
  if (prefilled || !S.rooms.length) return; prefilled = true;
  const raw = qs.get('aiPrefill'); if (!raw) return;
  try {
    const p = JSON.parse(raw);
    const rm = S.rooms.find((r) => r.id === p.room || r.id === p.roomId || r.name === p.room || (p.room && (r.name.includes(p.room) || String(p.room).includes(r.name)))) || S.rooms[0];
    const s = p.start ? t2m(p.start) : t2m('09:00'), e = p.end ? t2m(p.end) : Math.min(s + 60, DAY_E);
    S.modal = { type: 'new', title: p.title || '', roomId: rm.id, date: p.date || todayStr(), start: m2t(s), end: m2t(e > s ? e : Math.min(s + SLOT, DAY_E)), agenda: p.agenda || p.note || '', attendees: attList(p.attendees).join(', '), projectId: p.projectId || '' };
    renderModal();
  } catch (e) { console.warn('[meeting] aiPrefill 파싱 실패:', e); }
}

// ═══════════════ 렌더 ═══════════════
function render(opt = {}) {
  $('tabRooms').classList.toggle('on', S.tab === 'rooms'); $('tabMinutes').classList.toggle('on', S.tab !== 'rooms');
  const pane = $('pane');
  if (S.tab === 'rooms') { pane.innerHTML = rRooms(); return; }
  if (!pane.querySelector('.mm-wrap')) pane.innerHTML = '<div class="mm-wrap"><div class="mm-list" id="mmList"></div><div class="mm-main" id="mmMain"></div></div>';
  $('mmList').innerHTML = rList();
  const keep = opt.soft && (EDITING || REC.on) && $('mmMain').contains(document.activeElement) && document.activeElement !== document.body;   // 타자 중엔 편집 폼을 다시 그리지 않는다(포커스 유지)
  if (!keep) $('mmMain').innerHTML = REC.on ? rRecording() : S.sel ? rEditor(S.sel) : rEmpty();
  if (REC.on) scrollTr();
}

// ── 탭1: 회의실 예약 ──
function rRooms() {
  const days = weekDays(); const td = todayStr(); const nm = nowMin(); const live = S.meetings.filter(active);
  const cards = S.rooms.map((r) => {
    const cur = live.find((v) => v.roomId === r.id && v.date === td && t2m(v.start) <= nm && nm < t2m(v.end));
    const next = live.filter((v) => v.roomId === r.id && v.date === td && t2m(v.start) > nm).sort((a, b) => t2m(a.start) - t2m(b.start))[0];
    const st = cur ? `<b class="busy">사용중</b> ${esc(userName(cur.organizer))} · ~${esc(cur.end)}<br>${esc(cur.title)}` : `<b class="free">비어있음</b>${next ? `<br>다음: ${esc(next.start)} ${esc(next.title)}` : ''}`;
    const eq = [r.capacity ? `${r.capacity}명` : '', ...(Array.isArray(r.equipment) ? r.equipment : [])].filter(Boolean).join(' · ');
    return `<div class="room-card${S.room === r.id ? ' on' : ''}" data-a="pickRoom" data-v="${esc(r.id)}"><div class="rn"><span class="dot ${colorCls(r.color)}"></span>${esc(r.name)}${eq ? `<small>${esc(eq)}</small>` : ''}</div><div class="st">${st}</div></div>`;
  }).join('');
  const slots = []; for (let m = DAY_S; m < DAY_E; m += SLOT) slots.push(m);
  const timeCol = `<div class="daycol timecol">${slots.map((m) => `<div class="tlab">${m % 60 === 0 ? m2t(m) : ''}</div>`).join('')}</div>`;
  const heads = `<div class="gh timecol"></div>` + days.map((d) => `<div class="gh${d.date === td ? ' today' : ''}">${d.label}<div class="dd">${d.mm}/${d.dd}</div></div>`).join('');
  const N = Math.max(S.rooms.length, 1);
  let weekCount = 0;
  const cols = days.map((d) => {
    const dayResv = live.filter((v) => v.date === d.date && (S.room === 'all' || v.roomId === S.room)); weekCount += dayResv.length;
    const bg = slots.map((m) => `<div class="slotbg" data-a="newResv" data-d="${d.date}" data-m="${m}"></div>`).join('');
    const blocks = dayResv.map((v) => {
      const r = roomOf(v.roomId); const s = Math.max(t2m(v.start), DAY_S), e = Math.min(Math.max(t2m(v.end), s + 15), DAY_E);
      const top = (s - DAY_S) * PXMIN, h = Math.max((e - s) * PXMIN - 2, 16);
      let left = '2px', width = 'calc(100% - 4px)';
      if (S.room === 'all') { const li = Math.max(S.rooms.findIndex((x) => x.id === v.roomId), 0); left = `calc(${li * 100 / N}% + 1px)`; width = `calc(${100 / N}% - 2px)`; }
      return `<div class="rblk ${colorCls(r.color)}${v.status === '완료' ? ' done' : ''}" data-a="openResv" data-id="${esc(v.id)}" style="top:${top}px;height:${h}px;left:${left};width:${width}" title="${esc(r.name)} · ${esc(v.start)}~${esc(v.end)} · ${esc(v.title)} · ${esc(userName(v.organizer))}"><div class="bt">${esc(v.title)}</div><div class="bw">${esc(userName(v.organizer))}</div></div>`;
    }).join('');
    const nowln = (d.date === td && nm >= DAY_S && nm <= DAY_E) ? `<div class="nowline" style="top:${(nm - DAY_S) * PXMIN}px"></div>` : '';
    return `<div class="daycol">${bg}${blocks}${nowln}</div>`;
  }).join('');

// 편집 폼 → S.sel 사본에 실시간 반영(재렌더 없이)
document.addEventListener('input', (e) => {
  const t = e.target; if (t.id === 'mmQ') { S.q = t.value; $('mmItems').outerHTML = rList().match(/<div id="mmItems"[\s\S]*<\/div>$/)[0]; return; }
  const ed = t.dataset.ed; if (!ed) return;
  if (S.modal?.type === 'rooms') { const r = S.modal.rows[+t.dataset.i]; if (!r) return; if (ed === 'rm-cap') r.capacity = Number(t.value) || 0; else if (ed === 'rm-eq') r.equipment = attList(t.value); else r[ed.slice(3)] = t.value; return; }
  if (!S.sel) return; EDITING = true;
  const m = S.sel, mm = m.minutes, g = +t.dataset.g, i = +t.dataset.i, v = t.value;
  if (['title', 'date', 'start', 'end', 'roomId', 'projectId', 'status', 'agenda', 'transcript'].includes(ed)) m[ed] = v;
  else if (ed === 'organizer') m.organizer = userIdByName(v);
  else if (ed === 'attendees') m.attendees = attList(v);
  else if (ed === 'topic' || ed === 'summary') mm[ed] = v;
  else if (ed.startsWith('ag-')) { if (!mm.agendas[g]) mm.agendas[g] = { title: '', discussion: '', decision: '', actions: [] }; mm.agendas[g][ed.slice(3)] = v; }
  else if (ed.startsWith('act-')) { const a = mm.agendas[g]?.actions?.[i]; if (!a) return; const k = ed.slice(4); if (k === 'done') { a.done = t.checked; t.closest('.act-row').classList.toggle('done', a.done); } else if (k === 'who') a.who = userIdByName(v); else a[k] = v; }
});

// 예약 저장 (겹침 검사) — 수정이면 회의록·전사본 등 다른 필드는 merge 로 보존
function doSaveResv(editId) {
  const title = $('mTitle').value.trim(), roomId = $('mRoom').value, date = $('mDate').value, start = $('mS').value, end = $('mE').value;
  if (!title) return toast('회의 제목을 입력해 주세요', 'err');
  if (!roomId) return toast('회의실을 먼저 만들어 주세요 (회의실 관리)', 'err');
  if (!date) return toast('날짜를 선택해 주세요', 'err');
  if (!start || !end || t2m(end) <= t2m(start)) return toast('종료 시간이 시작 시간보다 늦어야 합니다', 'err');
  const clash = S.meetings.find((v) => active(v) && v.roomId === roomId && v.date === date && v.id !== editId && t2m(v.start) < t2m(end) && t2m(start) < t2m(v.end));
  if (clash) return toast(`겹치는 예약이 있습니다: ${clash.start}~${clash.end} ${clash.title} (${userName(clash.organizer)})`, 'err');
  const old = editId ? S.meetings.find((x) => x.id === editId) : null;
  const data = { title, roomId, date, start, end, organizer: userIdByName($('mOrg').value) || 'owner', attendees: attList($('mAtt').value), agenda: $('mAgenda').value.trim(), projectId: $('mProj').value, status: old?.status || '예약' };
  setDoc(doc(db, 'meetings', editId || doc(collection(db, 'meetings')).id), data, { merge: true })
    .then(() => toast(editId ? '수정됐습니다' : '예약됐습니다', 'ok')).catch((err) => toast('저장 실패: ' + err.message, 'err'));
  S.modal = null; renderModal();
}
async function saveRooms() {
  const rows = S.modal.rows.filter((r) => r.name.trim()); const del = S.modal.del;
  try {
    for (let i = 0; i < rows.length; i++) { const { id, _new, ...r } = rows[i]; delete r.createdAt; delete r.updatedAt; await setDoc(doc(db, 'rooms', id), { ...r, name: r.name.trim(), order: i + 1 }, { merge: true }); }
    for (const id of del) await deleteDoc(doc(db, 'rooms', id));
    if (del.includes(S.room)) S.room = 'all';
    toast('회의실을 저장했습니다', 'ok'); S.modal = null; renderModal();
  } catch (err) { toast('저장 실패: ' + err.message, 'err'); }
}

async function doSaveMin(quiet) {

}
async function sendTask(g, i) {   // 실행 항목 → 프로젝트 › 업무 보드 (tasks, source:'meeting')
  const m = S.sel, act = m?.minutes.agendas[g]?.actions[i]; if (!act) return;

    const ref = await addDoc(collection(db, 'tasks'), { title: act.text.trim(), projectId: m.projectId || '', assignee: act.who || 'owner', due: act.due || '', priority: 'mid', status: act.done ? 'done' : 'todo', memo: `회의록: ${m.title} (${m.date})${m.minutes.agendas[g].title ? ' · ' + m.minutes.agendas[g].title : ''}`, source: 'meeting' });

  toast('산초에게 보냈습니다 — 정리가 끝나면 이 화면에 바로 반영됩니다', 'ok');

// ═══════════════ 녹음 + 실시간 음성 인식 (Web Speech API ko-KR) ═══════════════
async function startRec() {
  const title = $('sTitle')?.value.trim(); if (!title) return toast('회의 제목을 입력해 주세요', 'err');
  const roomId = $('sRoom')?.value || '', attendees = attList($('sAtt')?.value), meetingId = $('sLink')?.value || '';
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast('이 브라우저는 음성인식을 지원하지 않습니다 — 크롬(Chrome)에서 열어 주세요', 'err');
  try {   // 마이크(녹음 파일용) — 거부해도 음성 인식은 별도로 시도
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    REC.media = new MediaRecorder(stream); REC.chunks = [];
    REC.media.ondataavailable = (ev) => { if (ev.data.size) REC.chunks.push(ev.data); };
    REC.media.start(1000);
  } catch (err) { console.warn('mic', err); toast('마이크 권한이 거부돼 음성 파일 저장은 건너뜁니다'); }
  REC.on = true; REC.paused = false; REC.startAt = Date.now(); REC.elapsed = 0; REC.lines = []; REC.interim = ''; REC.audioUrl = ''; REC.audioFor = '';
  REC.meta = { title, roomId, attendees, meetingId, date: todayStr(), start: hm(new Date()) };
  startRecog(SR);
  REC.timer = setInterval(() => { if (!REC.paused) { REC.elapsed = Math.floor((Date.now() - REC.startAt) / 1000); const t = $('recTimer'); if (t) t.textContent = fmtEl(REC.elapsed); } }, 500);
  S.modal = null; renderModal(); S.sel = null; S.isNew = false; EDITING = false; S.tab = 'minutes'; render();
}
function startRecog(SR) {
  const rg = new SR(); REC.recog = rg;
  rg.lang = 'ko-KR'; rg.continuous = true; rg.interimResults = true;
  rg.onresult = (ev) => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) { const r = ev.results[i]; if (r.isFinal) { const txt = r[0].transcript.trim(); if (txt) REC.lines.push({ t: REC.elapsed, txt }); } else interim += r[0].transcript; }
    REC.interim = interim; updateTrBox();
  };
  rg.onerror = (ev) => { if (ev.error === 'not-allowed') { toast('마이크 권한이 거부됐습니다', 'err'); stopRec(); } };
  rg.onend = () => { if (REC.on && !REC.paused) { try { rg.start(); } catch (e) {} } };   // 침묵으로 끊기면 자동 재시작
  try { rg.start(); } catch (e) {}
}
function updateTrBox() {
  const b = $('trBox'); if (!b) return;
  b.innerHTML = REC.lines.map((l) => `<div><span class="ts">[${fmtEl(l.t)}]</span>${esc(l.txt)}</div>`).join('') + (REC.interim ? `<div class="interim">${esc(REC.interim)}</div>` : '') + ((!REC.lines.length && !REC.interim) ? '<div class="hint">말씀하시면 여기에 실시간으로 글자가 올라옵니다...</div>' : '');
  b.scrollTop = b.scrollHeight;
}
function pauseRec() { REC.paused = true; try { REC.recog?.stop(); } catch (e) {} try { REC.media?.pause(); } catch (e) {} render(); }
function resumeRec() { REC.paused = false; REC.startAt = Date.now() - REC.elapsed * 1000; try { REC.recog?.start(); } catch (e) {} try { REC.media?.resume(); } catch (e) {} render(); }
async function stopRec() {
  if (!REC.on) return;
  REC.on = false; clearInterval(REC.timer);
  try { REC.recog?.stop(); } catch (e) {}
  if (REC.media && REC.media.state !== 'inactive') {
    await new Promise((res) => { REC.media.onstop = res; try { REC.media.stop(); } catch (e) { res(); } });
    try { REC.media.stream.getTracks().forEach((t) => t.stop()); } catch (e) {}
    if (REC.chunks.length) REC.audioUrl = URL.createObjectURL(new Blob(REC.chunks, { type: 'audio/webm' }));   // 세션 메모리 전용 — 저장소엔 안 넣는다(용량)
  }
  const meta = REC.meta || {}, transcript = REC.lines.map((l) => `[${fmtEl(l.t)}] ${l.txt}`).join('\n'), recordedAt = new Date().toISOString();
  let id = meta.meetingId;
  try {
    if (id) { const cur = S.meetings.find((x) => x.id === id) || {}; await setDoc(doc(db, 'meetings', id), { transcript, recordedAt, status: cur.status === '예약' ? '진행' : (cur.status || '진행') }, { merge: true }); }
    else { const ref = await addDoc(collection(db, 'meetings'), { title: meta.title || '회의', roomId: meta.roomId || '', date: meta.date || todayStr(), start: meta.start || '', end: hm(new Date()), organizer: 'owner', attendees: meta.attendees || [], agenda: '', status: '진행', projectId: '', transcript, recordedAt }); id = ref.id; }
  } catch (err) { console.warn('minute save fail', err); toast('전사본 저장 실패: ' + err.message, 'err'); }
  REC.audioFor = id || '';
  if (id) { const snap = await getDoc(doc(db, 'meetings', id)).catch(() => null); if (snap?.exists()) { S.sel = ensureMin({ id, ...snap.data() }); S.isNew = false; EDITING = false; } }
  render();
  toast(`녹음 종료 — ${REC.lines.length}개 문장이 인식됐습니다. '산초에게 회의록 정리 시키기'를 눌러 주세요`, 'ok');
}
window.addEventListener('beforeunload', (e) => { if (REC.on) { e.preventDefault(); e.returnValue = '녹음이 진행 중입니다. 나가면 녹음이 중단됩니다.'; } });
</script></body></html>
