<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>산초 · 도움말</title>
<link rel="stylesheet" href="/m/platform.css">
<script src="/m/sdb.js"></script>
<style>
  .hgrid{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
  .toc{position:sticky;top:0;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow)}
  .toc a{display:block;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--text);text-decoration:none}
  .toc a:hover{background:var(--bg2)} .toc a.on{background:var(--primary-light);color:var(--primary);font-weight:600}
  .sec{margin-bottom:26px;scroll-margin-top:12px}
  .sec h2{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
  .sec .lead{color:var(--text-light);font-size:13px;margin-bottom:12px}
  .steps{counter-reset:s;display:flex;flex-direction:column;gap:10px}
  .step{display:flex;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .step::before{counter-increment:s;content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
  .step b{display:block;margin-bottom:2px} .step .d{color:var(--text-light);font-size:12.5px;line-height:1.65}
  .cards2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  .hcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .hcard .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:4px} .hcard .t .ico{font-size:17px}
  .hcard .d{color:var(--text-light);font-size:12.5px;line-height:1.7;margin-bottom:10px}
  .say{display:block;width:100%;text-align:left;border:1px dashed var(--border);background:var(--bg2);border-radius:8px;padding:7px 10px;font:inherit;font-size:12.5px;color:var(--text);cursor:pointer;margin-top:5px}
  .say:hover{border-color:var(--primary);border-style:solid;background:var(--primary-lighter)} .say::before{content:'✳ ';color:var(--primary)}
  .file{font:11.5px ui-monospace,Consolas,monospace;color:var(--text-lighter);margin-top:8px}
  .qa{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .qa details{border-bottom:1px solid var(--border-light)} .qa details:last-child{border-bottom:0}
  .qa summary{padding:12px 16px;cursor:pointer;font-weight:600;font-size:13.5px;list-style:none;display:flex;justify-content:space-between}
  .qa summary::after{content:'▾';color:var(--text-lighter)} .qa details[open] summary::after{content:'▴'}
  .qa .a{padding:0 16px 14px;color:var(--text-light);font-size:13px;line-height:1.8}
  .qa .a code{background:var(--bg2);border:1px solid var(--border-light);border-radius:4px;padding:1px 5px;font-size:12px}
  .keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
  .key{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12.5px}
  .kbd{font:11px ui-monospace,Consolas,monospace;background:var(--bg2);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:2px 7px;flex:none}
  @media (max-width:900px){.hgrid{grid-template-columns:1fr}.toc{position:static}}
</style>
</head>
<body>
<div class="content-pad">
  <div class="mod-head">
    <div><div class="mod-title">도움말</div><div class="mod-sub">산초 플랫폼을 쓰는 법 — 처음 설정부터 화면별 사용법, 산초에게 말 시키는 요령까지</div></div>
    <div style="display:flex;gap:8px"><button class="btn" onclick="window.print()">🖨 인쇄</button><button class="btn btn-ai" data-say="산초 사용법을 처음 쓰는 사람에게 설명하듯 알려줘. 무엇부터 하면 되는지 5단계로.">✳ 산초에게 물어보기</button></div>
  </div>
  <div class="hgrid">
    <nav class="toc" id="toc"></nav>
    <div id="body"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = (t, kind = '') => { const el = document.getElementById('toast'); el.textContent = t; el.className = 'toast on ' + kind; clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2200); };
window.addEventListener('message', (e) => { if (e.data?.sancho && e.data.act === 'theme') document.documentElement.dataset.theme = e.data.theme || ''; });
let me = { name: '주인' };
window.fb.me().then((u) => { me = u || me; grind(); });

    </div></div>

      <div class="hcard"><div class="t"><span class="ico">🧠</span>기억시키기</div><div class="d">"기억해: 우리 회사 검사 기준은 …" 처럼 말하면 계속 기억합니다. 잊으라고 하면 지웁니다.</div><button class="say" data-say="기억해: ">기억해: …</button></div>
      <div class="hcard"><div class="t"><span class="ico">⏰</span>예약 걸기</div><div class="d">"매일 7시에 …", "10분마다 … 확인해서 바뀌면 알려줘" 처럼 시키면 스스로 실행하고 결과를 알림에 쌓습니다.</div><button class="say" data-say="매일 아침 7시 30분에 오늘 일정과 결재 대기, 긴급 메일을 정리해서 알려줘.">매일 아침 브리핑 예약</button></div>
      <div class="hcard"><div class="t"><span class="ico">📄</span>문서 만들기</div><div class="d">엑셀·PPT·워드·PDF 를 만들어 <b>파일함</b> 에 넣고 채팅에 카드로 띄웁니다. 카드에서 바로 열고 내려받습니다.</div><button class="say" data-say="이번 달 프로젝트 진행 현황을 엑셀로 만들어줘. 프로젝트별 진도율과 지연 항목 포함해서.">엑셀 보고서 만들기</button></div>
      <div class="hcard"><div class="t"><span class="ico">🔎</span>조사·정리</div><div class="d">웹을 찾아 정리하고 위키 노트로 쌓아 둡니다. 다음에 물으면 그 노트를 먼저 봅니다.</div><button class="say" data-say="조사해서 위키에 정리해줘: ">조사해서 위키에 정리해줘</button></div>
      <div class="hcard"><div class="t"><span class="ico">🛠</span>산초 자체 고치기</div><div class="d">권한 메뉴에서 <b>자기 수정</b> 을 켜면 산초가 자기 화면·기능을 고칩니다. 고친 뒤 스스로 검사를 통과해야만 반영되고, 실패하면 되돌립니다.</div><button class="say" data-say="일정 화면에 주간 보기를 기본으로 해줘.">화면 고쳐달라기</button></div>
      <div class="hcard"><div class="t"><span class="ico">📎</span>파일 주고 시키기</div><div class="d">입력창 ＋ 또는 끌어다 놓기·붙여넣기로 그림·PDF·엑셀을 주면 읽고 답합니다.</div><button class="say" data-say="첨부한 도면을 보고 검사 항목을 뽑아줘.">첨부 파일로 시키기</button></div>
    </div></div>

  <div class="sec" id="s-qa"><h2>자주 묻는 것</h2><div class="qa">${질문.map(([q, a]) => `<details><summary>${esc(q)}</summary><div class="a">${a}</div></details>`).join('')}</div></div>

  <div class="sec" id="s-keys"><h2>단축키</h2><div class="keys">${단축.map(([k, v]) => `<div class="key"><span class="kbd">${esc(k)}</span><span>${esc(v)}</span></div>`).join('')}</div>
    <div class="lead" style="margin-top:12px">더 자세한 설명은 산초 폴더의 <code>README.md</code> 와 <code>작업기록.md</code> 에 있습니다.</div></div>`;

  document.getElementById('toc').innerHTML = [['s-start', '시작하기'], ['s-screens', '화면별 사용법'], ['s-sancho', '산초에게 말하는 요령'], ['s-qa', '자주 묻는 것'], ['s-keys', '단축키']]
    .map(([id, t], i) => `<a href="#${id}" class="${i === 0 ? 'on' : ''}">${t}</a>`).join('');
}
document.addEventListener('click', (e) => {
  const s = e.target.closest('[data-say]'); if (s) { SANCHO.ask(s.dataset.say); toast('채팅창에 넣었습니다 — 대시보드에서 보내세요', 'ok'); return; }
  const a = e.target.closest('.toc a'); if (a) { document.querySelectorAll('.toc a').forEach((x) => x.classList.toggle('on', x === a)); }
});
grind();
</script>
</body>
</html>
