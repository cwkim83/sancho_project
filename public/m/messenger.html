<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>산초 · 메신저</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/m/platform.css">
<script src="/m/sdb.js"></script>
<style>
/* 메신저 — 세종 플랫폼 v2 modules/messenger 의 배치를 옮기고 색은 전부 platform.css 변수로 */
html, body { overflow: hidden; }
body { display: flex; flex-direction: column; }
.content-pad { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.mod-head { margin-bottom: 14px; flex-shrink: 0; }
.head-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.msg-layout { display: grid; grid-template-columns: 270px 1fr; flex: 1; min-height: 0; background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }

/* 왼쪽 채널 목록 */
.msg-side { background: var(--bg2); display: flex; flex-direction: column; border-right: 1px solid var(--border); min-height: 0; }
.side-search { padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--card); }
.side-search-wrap { position: relative; }
.side-search-input { width: 100%; padding: 7px 10px 7px 30px; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 12px; outline: none; }
.side-search-input::placeholder { color: var(--text-lighter); }
.side-search-input:focus { border-color: var(--primary); background: var(--card); }
.side-search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-lighter); display: flex; }
.side-scroll { flex: 1; overflow-y: auto; padding: 8px; }
.side-scroll::-webkit-scrollbar { width: 5px; } .side-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.msg-sec-toggle { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; margin: 6px 0 2px; border-radius: 6px; cursor: pointer; user-select: none; color: var(--text-light); font-size: 11.5px; font-weight: 700; letter-spacing: .2px; }
.msg-sec-toggle:hover { color: var(--text); background: var(--border-light); }
.sec-title-left { display: flex; align-items: center; gap: 6px; }
.msg-sec-caret { display: flex; align-items: center; transition: transform .15s; color: var(--text-lighter); }
.msg-sec-caret.open { transform: rotate(90deg); }
.msg-sec-count { font-size: 10px; background: var(--border-light); color: var(--text-light); padding: 1px 6px; border-radius: 10px; font-weight: 600; }
.sec-empty { font-size: 11.5px; color: var(--text-lighter); padding: 6px 10px; line-height: 1.5; }
.msg-ch { display: flex; align-items: center; gap: 9px; padding: 7px 9px; margin-bottom: 2px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text); transition: background .1s; }
.msg-ch:hover { background: var(--border-light); }
.msg-ch.active { background: var(--primary-light); color: var(--primary); font-weight: 700; }
.msg-ch-ico { flex-shrink: 0; width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; background: var(--border-light); color: var(--text-light); }
.msg-ch.active .msg-ch-ico { background: var(--primary-light); color: var(--primary); }
.msg-ch-info { flex: 1; min-width: 0; }
.msg-ch-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg-ch.active .msg-ch-name { font-weight: 700; }
.msg-ch-last { font-size: 11px; color: var(--text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.msg-unread-badge { flex-shrink: 0; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; min-width: 17px; height: 17px; line-height: 17px; text-align: center; border-radius: 8.5px; padding: 0 4px; }

/* 아바타: 회색 = 다른 사람, me = 주인, sancho = ✳ 산초 */
.av { width: 28px; height: 28px; border-radius: 8px; background: var(--text-light); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; flex-shrink: 0; }
.av.me { background: var(--primary); }
.av.sancho { background: linear-gradient(135deg, var(--primary), var(--purple)); font-size: 14px; }
.msg-avatar { width: 32px; height: 32px; border-radius: 9px; font-size: 12.5px; }

/* 오른쪽 대화창 */
.msg-main { display: flex; flex-direction: column; min-height: 0; background: var(--card); }
.msg-head { padding: 11px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.msg-head-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; min-width: 0; }
.msg-head-title .ico { color: var(--primary); display: flex; }
.msg-head-right { display: flex; align-items: center; gap: 8px; }
.members-tag { display: flex; align-items: center; gap: 5px; padding: 4px 10px; background: var(--primary-light); border: 1px solid transparent; border-radius: 12px; font-size: 12px; color: var(--primary); font-weight: 600; cursor: pointer; }
.members-tag:hover { border-color: var(--primary); }
.msg-body-wrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.msg-body { flex: 1; overflow-y: auto; padding: 16px 20px; background: var(--bg2); display: flex; flex-direction: column; }
.msg-body::-webkit-scrollbar { width: 6px; } .msg-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.msg-date { display: flex; align-items: center; gap: 10px; margin: 6px 0 14px; font-size: 11px; color: var(--text-lighter); flex-shrink: 0; }
.msg-date::before, .msg-date::after { content: ''; flex: 1; border-top: 1px solid var(--border); }
.msg-row { display: flex; gap: 10px; margin-bottom: 14px; align-items: flex-start; flex-shrink: 0; }
.msg-row.mine { flex-direction: row-reverse; }
.msg-row.mine .msg-avatar { display: none; }
.msg-bubble-wrap { display: flex; flex-direction: column; max-width: 70%; }
.msg-row.mine .msg-bubble-wrap { align-items: flex-end; }
.msg-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
.msg-author { font-size: 12px; font-weight: 700; color: var(--text); }
.msg-author.sancho { color: var(--purple); }
.msg-dept { font-size: 11px; color: var(--text-light); }
.msg-time { font-size: 10.5px; color: var(--text-lighter); }
.msg-del { background: none; border: none; color: var(--text-lighter); cursor: pointer; padding: 0; display: flex; }
.msg-del:hover { color: var(--danger); }
.msg-bubble { background: var(--card); padding: 10px 14px; border-radius: 12px; border-top-left-radius: 2px; font-size: 13.5px; line-height: 1.5; color: var(--text); word-break: break-word; white-space: pre-wrap; box-shadow: var(--shadow); border: 1px solid var(--border); }
.msg-bubble.mine { background: var(--primary); color: #fff; border: none; border-radius: 12px; border-top-right-radius: 2px; }
.msg-file-card { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--bg2); border-radius: 6px; margin-top: 4px; }
.msg-bubble.mine .msg-file-card { background: rgba(255,255,255,.15); }
.msg-file-icon { width: 28px; height: 28px; border-radius: 5px; background: rgba(0,0,0,.06); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.msg-bubble.mine .msg-file-icon { background: rgba(255,255,255,.2); }
.msg-file-name { font-weight: 600; font-size: 12px; color: inherit; text-decoration: none; word-break: break-all; }
.msg-file-name:hover { text-decoration: underline; }
.msg-file-size { font-size: 10px; opacity: .8; margin-top: 1px; }
.msg-img { display: block; max-width: 240px; max-height: 200px; border-radius: 8px; margin-top: 4px; }
.msg-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-lighter); gap: 8px; text-align: center; font-size: 12.5px; line-height: 1.7; }
.msg-empty b { color: var(--text-light); font-size: 14px; }

/* 입력바 */
.msg-input-container { padding: 12px 18px; background: var(--card); border-top: 1px solid var(--border); }
.msg-input-box { display: flex; align-items: flex-end; gap: 8px; background: var(--bg2); border: 1.5px solid var(--border); border-radius: 12px; padding: 5px 6px 5px 12px; }
.msg-input-box:focus-within { border-color: var(--primary); background: var(--card); }
.msg-input { flex: 1; border: none; background: transparent; font-size: 13.5px; color: var(--text); outline: none; resize: none; line-height: 1.5; max-height: 140px; padding: 6px 0; }
.msg-input::placeholder { color: var(--text-lighter); }
.input-tool-btn { width: 32px; height: 32px; border-radius: 6px; border: none; background: transparent; color: var(--text-light); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.input-tool-btn:hover { background: var(--border-light); color: var(--text); }
.input-tool-btn:disabled { opacity: .5; cursor: default; }
.msg-send-btn { width: 34px; height: 34px; border-radius: 8px; border: none; background: var(--primary); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.msg-send-btn:hover { background: var(--primary-hover); }
.msg-drop-hint { display: none; position: absolute; inset: 10px; border: 2px dashed var(--primary); border-radius: 14px; background: var(--primary-lighter); align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--primary); pointer-events: none; z-index: 20; }
.msg-drop-hint.show { display: flex; }

/* 모달 안 목록 */
.msg-pick { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 3px; }
.msg-pick:hover { background: var(--bg2); }
.member-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; }
@media (max-width: 850px) { .msg-layout { grid-template-columns: 1fr; } }
</style>
</head><body><div class="content-pad" id="root"></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="modal"><div class="modal">
  <div class="modal-head"><div class="modal-title" id="mTitle"></div><button class="btn btn-ghost btn-sm" onclick="closeModal()" title="닫기">✕</button></div>
  <div class="modal-body" id="mBody"></div>
  <div class="modal-foot"><button class="btn" onclick="closeModal()">취소</button><button class="btn btn-primary" id="mOk">확인</button></div>
</div></div>
<script>
const { db, doc, collection, getDoc, getDocs, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot, query, where, orderBy, limit, writeBatch } = window.fb;
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = (t, kind = '') => { const el = document.getElementById('toast'); el.textContent = t; el.className = 'toast on ' + kind; clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2200); };
window.addEventListener('message', (e) => { if (e.data?.sancho && e.data.act === 'theme') document.documentElement.dataset.theme = e.data.theme || ''; });
let me = null;                                  // 주인(단일 사용자): {uid:'owner', name, title, dept, email}
window.fb.me().then((u) => { me = u; boot(); });

// ══════════ 상수 ══════════
const NOTICE_ID = 'c1', SANCHO_DM = 'dm_sancho', MAX_MB = 25;
const SANCHO_USER = { id: 'sancho', name: '산초', title: '', dept: 'AI 비서' };
const ICONS = {
  search: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
  chevron: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`,
  megaphone: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>`,
  building: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>`,
  folder: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L8.6 3.3A2 2 0 0 0 6.93 2H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2Z"/></svg>`,
  users: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
  user: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
  userPlus: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg>`,
  send: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`,
  paperclip: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57a4 4 0 1 1 5.66 5.66l-8.59 8.58a2 4 0 0 1-2.83-2.83l8.49-8.48"/></svg>`,
  fileText: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="10" y1="9" x2="8" y2="9"/></svg>`,
  trash: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>`,
  logOut: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>`,
};

// ══════════ 상태 (화면은 onSnapshot 으로만 그린다) ══════════
const S = { users: [], depts: [], projects: [], channels: [], messages: [] };
let activeCh = NOTICE_ID, searchFilter = '', uploading = false;
let collapsed = {}; try { collapsed = JSON.parse(localStorage.sancho_msg_collapsed || '{}'); } catch {}   // 접힘 상태만 localStorage (UI 취향)
function toggleSection(k) { collapsed[k] = !collapsed[k]; try { localStorage.sancho_msg_collapsed = JSON.stringify(collapsed); } catch {} render(); }

// ══════════ 도우미 ══════════
const ms = (t) => { const n = Date.parse(t || ''); return isNaN(n) ? 0 : n; };
const pad = (n) => String(n).padStart(2, '0');
const hhmm = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const DAYS = ['일', '월', '화', '수', '목', '금', '토'];
const fmtDay = (d) => { const t = new Date(), y = new Date(); y.setDate(t.getDate() - 1); const same = (a, b) => a.toDateString() === b.toDateString(); return same(d, t) ? '오늘' : same(d, y) ? '어제' : `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${DAYS[d.getDay()]})`; };
const fmtSize = (b) => { b = Number(b) || 0; return b >= 1048576 ? (b / 1048576).toFixed(1) + 'MB' : b >= 1024 ? Math.round(b / 1024) + 'KB' : b + 'B'; };
const isImg = (n) => /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(n || '');
const byOrder = (a, b) => (Number(a.order) || 0) - (Number(b.order) || 0) || String(a.name || '').localeCompare(String(b.name || ''), 'ko');
const virt = (id, name, type, extra = {}) => ({ id, name, type, members: [], ...extra, _virtual: true });   // 문서가 없어도 항상 보이는 가상 채널

function getU(id) {
  if (!id) return { id: '', name: '알 수 없음', _unknown: true };
  if (id === 'sancho') return SANCHO_USER;
  return S.users.find((u) => u.id === id || u.email === id) || (id === me.uid ? { id: me.uid, name: me.name || '주인', title: me.title || '', dept: me.dept || '' } : { id, name: String(id), _unknown: true });
}
const avatar = (u, cls = 'av') => `<div class="${cls} ${u.id === 'sancho' ? 'sancho' : u.id === me.uid ? 'me' : ''}">${u.id === 'sancho' ? '✳' : esc((u.name || '?').charAt(0))}</div>`;
const activeUsers = () => S.users.filter((u) => u.active !== false);

// ══════════ 채널 목록: 공지(c1 항상) · 부서(depts 에서) · 프로젝트(projects 에서 proj_id) · 그룹 · DM(산초 고정) ══════════
function chLists() {
  const chs = S.channels;
  const noticeChs = chs.filter((c) => c.type === 'notice');
  if (!noticeChs.some((c) => c.id === NOTICE_ID)) noticeChs.unshift(virt(NOTICE_ID, '공지사항', 'notice'));
  const deptChs = [...S.depts].sort(byOrder).map((d) => { const ex = chs.find((c) => c.type === 'dept' && (c.dept === d.id || c.dept === d.name || c.name === d.name)); return ex ? { ...ex, name: d.name, dept: d.id } : virt('dept_' + d.id, d.name, 'dept', { dept: d.id }); });
  chs.filter((c) => c.type === 'dept' && !deptChs.some((x) => x.id === c.id)).forEach((c) => deptChs.push(c));   // 부서 문서 없이 산초가 만든 부서 채널
  const projChs = S.projects.filter((p) => !p.hidden).sort((a, b) => String(a.code || a.name || '').localeCompare(String(b.code || b.name || ''), 'ko')).map((p) => {
    const cid = 'proj_' + p.id, ex = chs.find((c) => c.id === cid || (c.type === 'project' && c.projectId === p.id));
    const members = [...new Set([p.pm, ...(Array.isArray(p.members) ? p.members : []), ...(ex?.members || [])])].filter(Boolean);
    const name = p.name || p.code || ('프로젝트 ' + p.id);
    return ex ? { ...ex, name: ex.name || name, projectId: p.id, members } : virt(cid, name, 'project', { projectId: p.id, members });
  });
  chs.filter((c) => c.type === 'project' && !projChs.some((x) => x.id === c.id)).forEach((c) => projChs.push(c));
  const groupChs = chs.filter((c) => c.type === 'group' && (c.members || []).includes(me.uid));
  const sanchoDm = chs.find((c) => c.type === 'dm' && (c.members || []).includes('sancho') && (c.members || []).includes(me.uid)) || virt(SANCHO_DM, '산초', 'dm', { members: [me.uid, 'sancho'] });
  const dmChs = [sanchoDm, ...chs.filter((c) => c.type === 'dm' && c.id !== sanchoDm.id && (c.members || []).includes(me.uid))];
  return { noticeChs, deptChs, projChs, groupChs, dmChs, all: [...noticeChs, ...deptChs, ...projChs, ...groupChs, ...dmChs] };
}
function getChannel(cid) { const L = chLists(); return L.all.find((c) => c.id === cid) || S.channels.find((c) => c.id === cid) || L.all[0]; }
const dmOther = (ch) => getU((ch.members || []).find((id) => id !== me.uid));
const dmTitle = (ch) => { const u = dmOther(ch); return [u.name, u.title].filter(Boolean).join(' '); };
const chLabel = (ch) => ch.type === 'dm' ? dmTitle(ch) : (ch.name || ch.id);
const isSanchoDm = (ch) => ch.type === 'dm' && (ch.members || []).includes('sancho');
function unread(ch) { const last = ms(ch.lastRead?.[me.uid]); return S.messages.filter((m) => m.channelId === ch.id && !m.deleted && m.userId !== me.uid && ms(m.ts) > last).length; }

function chMembers(ch) {
  if (!ch) return [];
  if (ch.type === 'notice') return activeUsers();
  if (ch.type === 'dept') { const d = S.depts.find((x) => x.id === ch.dept || x.name === ch.dept || x.name === ch.name); const keys = [ch.dept, ch.name, d?.id, d?.name].filter(Boolean); return activeUsers().filter((u) => keys.includes(u.dept)); }
  if (ch.type === 'project') { const p = S.projects.find((x) => x.id === ch.projectId); return [...new Set([p?.pm, ...(Array.isArray(p?.members) ? p.members : []), ...(ch.members || [])])].filter(Boolean).map(getU); }
  return (ch.members || []).map(getU);
}

// ══════════ 그리기 ══════════
function render() {
  const side = document.querySelector('.side-scroll'), st = side ? side.scrollTop : null;
  document.getElementById('root').innerHTML = messenger();
  filterChannelsDOM(searchFilter);
  const b = document.getElementById('msgBody'); if (b) b.scrollTop = b.scrollHeight;
  const side2 = document.querySelector('.side-scroll'); if (side2 && st != null) side2.scrollTop = st;
}
function renderKeepInput() {   // 스냅샷이 와서 다시 그려도 입력 중인 글·커서·초점은 지킨다
  const a = document.activeElement, id = a && (a.id === 'msgInput' || a.id === 'chSearch') ? a.id : null;
  const inp = document.getElementById('msgInput'), val = inp ? inp.value : '', s = a?.selectionStart, e = a?.selectionEnd;
  render();
  const i2 = document.getElementById('msgInput'); if (i2 && val) { i2.value = val; autoGrow(i2); }
  if (id) { const el = document.getElementById(id); if (el) { el.focus(); try { if (s != null) el.setSelectionRange(s, e); } catch {} } }
}
function filterChannelsDOM(kw) {
  searchFilter = kw || ''; const k = searchFilter.trim().toLowerCase();
  document.querySelectorAll('.msg-ch').forEach((el) => { el.style.display = !k || (el.dataset.search || '').toLowerCase().includes(k) ? 'flex' : 'none'; });
}

function messenger() {
  const L = chLists(), ch = getChannel(activeCh);
  const chItem = (c) => {
    const last = [...S.messages].reverse().find((m) => m.channelId === c.id && !m.deleted), n = unread(c);
    let label = c.name, icon;
    if (c.type === 'dm') { const ou = dmOther(c); label = dmTitle(c) || c.name; icon = avatar(ou); }
    else icon = `<span class="msg-ch-ico">${c.type === 'notice' ? ICONS.megaphone : c.type === 'dept' ? ICONS.building : c.type === 'project' ? ICONS.folder : ICONS.users}</span>`;
    const lastTxt = last ? (last.files?.length ? '📎 ' + (last.files[0].name || '파일') : (last.text || '')).slice(0, 22) : '';
    return `<div class="msg-ch ${c.id === activeCh ? 'active' : ''}" data-search="${esc(label + ' ' + (last?.text || ''))}" onclick="setCh('${esc(c.id)}')">${icon}<div class="msg-ch-info"><div class="msg-ch-name">${c.type === 'dm' ? '' : '# '}${esc(label)}</div>${lastTxt ? `<div class="msg-ch-last">${esc(lastTxt)}</div>` : ''}</div>${n ? `<span class="msg-unread-badge">${n > 99 ? '99+' : n}</span>` : ''}</div>`;
  };
  const section = (key, label, chs, emptyText) => {
    const col = !!collapsed[key] && !searchFilter.trim();   // 검색 중엔 접힌 섹션도 펼쳐 보인다
    const sum = col ? chs.reduce((n, c) => n + unread(c), 0) : 0;
    return `<div class="msg-sec-toggle" onclick="toggleSection('${key}')"><div class="sec-title-left"><span class="msg-sec-caret${col ? '' : ' open'}">${ICONS.chevron}</span><span>${label}</span>${chs.length ? `<span class="msg-sec-count">${chs.length}</span>` : ''}${sum ? `<span class="msg-unread-badge">${sum > 99 ? '99+' : sum}</span>` : ''}</div></div>${col ? '' : chs.length ? chs.map(chItem).join('') : `<div class="sec-empty">${emptyText || ''}</div>`}`;
  };
  const members = chMembers(ch);
  const icon = ch.type === 'dm' ? ICONS.user : ch.type === 'notice' ? ICONS.megaphone : ch.type === 'dept' ? ICONS.building : ch.type === 'project' ? ICONS.folder : ICONS.users;
  return `
  <div class="mod-head">
    <div><div class="mod-title">메신저</div><div class="mod-sub">공지 · 부서 채널 · 프로젝트 협업 · 그룹 · 1:1 메시지 — 산초도 함께 대화합니다</div></div>
    <div class="head-actions">
      <button class="btn" onclick="openNewDM()">${ICONS.userPlus} 1:1 채팅</button>
      <button class="btn btn-primary" onclick="openNewGroup()">${ICONS.users} 그룹 생성</button>
      <button class="btn btn-ai" onclick="askBrief()">✳ 산초에게 시키기</button>
    </div>
  </div>
  <div class="msg-layout">
    <div class="msg-side">
      <div class="side-search"><div class="side-search-wrap"><span class="side-search-icon">${ICONS.search}</span><input id="chSearch" type="text" class="side-search-input" placeholder="채널 및 이름 검색" value="${esc(searchFilter)}" oninput="filterChannelsDOM(this.value)"></div></div>
      <div class="side-scroll">
        ${section('notice', '공지사항', L.noticeChs)}
        ${section('dept', '부서 채널', L.deptChs, '등록된 부서가 없습니다. 조직 메뉴에서 부서를 추가해 주세요.')}
        ${section('project', '프로젝트', L.projChs, '등록된 프로젝트가 없습니다.')}
        ${section('group', '그룹 채팅', L.groupChs, '그룹 생성 버튼으로 시작해 주세요.')}
        ${section('dm', '다이렉트 메시지', L.dmChs, '1:1 채팅 버튼으로 대화를 시작해 주세요.')}
      </div>
    </div>
    <div class="msg-main">
      <div class="msg-head">
        <div class="msg-head-title"><span class="ico">${icon}</span><span>${esc(ch.type === 'dm' ? chLabel(ch) : '# ' + chLabel(ch))}</span></div>
        <div class="msg-head-right">
          <div class="members-tag" onclick="showMembers('${esc(ch.id)}')" title="참여 멤버 보기">${ICONS.users}<span>${members.length}명 참여</span></div>
          <button class="btn btn-sm btn-ai" onclick="askSummary()" title="이 채널 대화를 산초가 요약합니다">✳ 산초에게</button>
          ${(ch.type === 'dm' || ch.type === 'group') && !ch._virtual && !isSanchoDm(ch) ? `<button class="btn btn-sm btn-danger" onclick="leaveChannel('${esc(ch.id)}')" title="대화방 나가기">${ICONS.logOut} 나가기</button>` : ''}
        </div>
      </div>
      <div class="msg-body-wrap" ondragover="msgDragOver(event)" ondragleave="msgDragLeave(event)" ondrop="msgDrop(event)">
        <div class="msg-body" id="msgBody">${renderMessages(ch)}</div>
        <div id="msgDropHint" class="msg-drop-hint">여기에 파일을 놓으면 첨부됩니다 (파일당 ${MAX_MB}MB 이하)</div>
      </div>
      <div class="msg-input-container"><div class="msg-input-box">
        <button class="input-tool-btn" onclick="attachFile()" title="파일 첨부" ${uploading ? 'disabled' : ''}>${uploading ? '⏳' : ICONS.paperclip}</button>
        <textarea id="msgInput" class="msg-input" rows="1" placeholder="${isSanchoDm(ch) ? '산초에게 말해 보세요 (Enter 전송 · Shift+Enter 줄바꿈)' : '메시지를 입력하세요 (Enter 전송 · Shift+Enter 줄바꿈 · @산초 로 부르기)'}" onkeydown="inputKey(event)" oninput="autoGrow(this)"></textarea>
        <button class="msg-send-btn" onclick="sendMsg()" title="전송">${ICONS.send}</button>
      </div></div>
    </div>
  </div>`;
}

function fileCard(f) {
  const url = f.path ? window.SANCHO.dl(f.path) : '';
  if (url && isImg(f.name)) return `<a href="${esc(url)}" target="_blank" rel="noopener"><img class="msg-img" src="${esc(url)}" alt="${esc(f.name)}"></a>`;
  return `<div class="msg-file-card"><div class="msg-file-icon">${ICONS.fileText}</div><div>${url ? `<a class="msg-file-name" href="${esc(url)}" target="_blank" rel="noopener">${esc(f.name || '파일')}</a>` : `<span class="msg-file-name">${esc(f.name || '파일')}</span>`}<div class="msg-file-size">${fmtSize(f.size)}</div></div></div>`;
}
function renderMessages(ch) {
  const msgs = S.messages.filter((m) => m.channelId === ch.id && !m.deleted);
  if (!msgs.length) return `<div class="msg-empty"><b>아직 메시지가 없습니다</b><div>첫 메시지를 남겨 보세요. <b>@산초</b> 로 시작하면 산초가 답합니다.</div><button class="btn btn-ai btn-sm" onclick="askBrief()">✳ 산초에게 시키기</button></div>`;
  let lastDay = ''; const out = [];
  for (const m of msgs) {
    const d = new Date(m.ts || m.createdAt || 0), ok = !isNaN(d), day = ok ? fmtDay(d) : '';
    if (day && day !== lastDay) { out.push(`<div class="msg-date">${day}</div>`); lastDay = day; }
    const u = getU(m.userId), mine = m.userId === me.uid, sancho = m.userId === 'sancho';
    const files = Array.isArray(m.files) ? m.files : [];
    const body = (m.text ? esc(m.text) : '') + files.map(fileCard).join('');
    const time = ok ? hhmm(d) : '';
    if (mine) out.push(`<div class="msg-row mine"><div class="msg-bubble-wrap"><div class="msg-meta"><button class="msg-del" onclick="deleteMsg('${esc(m.id)}')" title="메시지 삭제">${ICONS.trash}</button><span class="msg-time">${time}</span></div><div class="msg-bubble mine">${body}</div></div></div>`);
    else out.push(`<div class="msg-row">${avatar(u, 'av msg-avatar')}<div class="msg-bubble-wrap"><div class="msg-meta"><span class="msg-author${sancho ? ' sancho' : ''}">${esc(u._unknown ? (m.userName || u.name) : u.name)}${u.title ? ' ' + esc(u.title) : ''}</span><span class="msg-dept">${esc(u.dept || '')}</span><span class="msg-time">${time}</span></div><div class="msg-bubble">${body}</div></div></div>`);
  }
  return out.join('');
}

// ══════════ 채널 이동 · 읽음 처리(channels.lastRead[owner]) ══════════
function setCh(cid) { activeCh = cid; const ch = getChannel(cid); markRead(ch); window.SANCHO.title('메신저 · ' + chLabel(ch)); render(); }
async function markRead(ch) {
  if (!ch) return;
  const patch = { ['lastRead.' + me.uid]: new Date().toISOString() };
  if (ch._virtual) Object.assign(patch, { name: ch.name, type: ch.type, members: ch.members || [] }, ch.dept ? { dept: ch.dept } : {}, ch.projectId ? { projectId: ch.projectId } : {});   // 가상 채널은 첫 방문에 문서로 굳힌다
  try { await updateDoc(doc(db, 'channels', ch.id), patch); } catch (e) { console.error('읽음 처리 오류', e); }
}
function autoRead() { const ch = getChannel(activeCh); if (ch && unread(ch)) markRead(ch); }   // 보고 있는 채널에 새 글이 오면 바로 읽음

async function leaveChannel(cid) {
  if (!confirm('이 대화방에서 나가시겠습니까?\n나가면 목록에서 사라집니다.')) return;
  const ch = S.channels.find((c) => c.id === cid); if (!ch) return;
  try { await updateDoc(doc(db, 'channels', cid), { members: (ch.members || []).filter((id) => id !== me.uid) }); activeCh = NOTICE_ID; render(); toast('대화방에서 나갔습니다'); }
  catch (e) { toast('나가기 실패: ' + e.message, 'err'); }
}
async function deleteMsg(id) {
  if (!confirm('이 메시지를 삭제하시겠습니까?')) return;
  try { await updateDoc(doc(db, 'messages', id), { deleted: true }); } catch (e) { toast('삭제 실패: ' + e.message, 'err'); }
}

// ══════════ 보내기 · 산초 부르기 ══════════
function inputKey(e) { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMsg(); } }
function autoGrow(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px'; }
const postMsg = (channelId, text, files = []) => addDoc(collection(db, 'messages'), { channelId, userId: me.uid, userName: me.name || '주인', text, ts: new Date().toISOString(), files });
const sanchoDoc = (ch, what) => `같은 파일에 새 문서(임의 영문·숫자 키)로 { channelId:'${ch.id}', userId:'sancho', userName:'산초', text:'${what}', ts:'지금 ISO 시각' } 을 추가해 남겨라.`;
async function sendMsg() {
  const inp = document.getElementById('msgInput'), text = (inp?.value || '').trim(); if (!text) return;
  const ch = getChannel(activeCh); inp.value = ''; autoGrow(inp);
  try {
    await postMsg(ch.id, text);
    if (/^@산초/.test(text) || isSanchoDm(ch)) {
      window.SANCHO.ask(`메신저 채널 ${chLabel(ch)}(id ${ch.id}) 에 주인이 '${text}' 라고 물었다. 필요하면 db/messages.json 에서 channelId 가 '${ch.id}' 인 최근 메시지를 읽어 맥락을 잡고, ${sanchoDoc(ch, '답')} 답은 메신저 말투로 짧게.`, true);
      toast('산초에게 물었습니다');
    }
  } catch (e) { toast('전송 실패: ' + e.message, 'err'); inp.value = text; autoGrow(inp); }
}
function askSummary() {
  const ch = getChannel(activeCh);
  window.SANCHO.ask(`메신저 채널 ${chLabel(ch)}(id ${ch.id}) 의 대화를 요약해줘: db/messages.json 에서 channelId 가 '${ch.id}' 인 메시지(deleted 가 아닌 것)를 ts 순으로 읽고 핵심 내용·결정된 것·해야 할 일을 정리해, ${sanchoDoc(ch, '요약')}`, true);
  toast('산초에게 요약을 시켰습니다');
}
function askBrief() {
  window.SANCHO.ask(`db/messages.json 을 읽고 오늘(${ymd(new Date())}) 올라온 메시지를 채널별로 훑어, 내가 답해야 할 것·결정된 것·할 일을 정리한 브리핑을 ${sanchoDoc({ id: NOTICE_ID }, '브리핑')} 채널 이름은 db/channels.json 에서 찾아라(없으면 id 로).`, false);
  toast('산초 채팅창에 지시문을 채웠습니다. 고쳐서 보내세요');
}

// ══════════ 첨부 (/api/upload → {name, path, size}) · 드래그앤드롭 ══════════
function attachFile() { if (uploading) return; const i = document.createElement('input'); i.type = 'file'; i.multiple = true; i.onchange = () => sendFiles(i.files); i.click(); }
async function sendFiles(list) {
  const files = Array.from(list || []); if (!files.length) return;
  const big = files.filter((f) => f.size > MAX_MB * 1048576);
  if (big.length) return toast(`파일당 최대 ${MAX_MB}MB 까지 첨부할 수 있습니다: ` + big.map((f) => f.name).join(', '), 'err');
  const ch = getChannel(activeCh); uploading = true; renderKeepInput();
  try {
    const saved = [];
    for (const f of files) { const r = await window.SANCHO.api('/api/upload', { method: 'POST', headers: { 'x-name': encodeURIComponent(f.name) }, body: f }); saved.push({ name: f.name, path: r.path, size: f.size }); }
    await postMsg(ch.id, '', saved);
  } catch (e) { toast('업로드 실패: ' + e.message, 'err'); }
  finally { uploading = false; renderKeepInput(); }
}
function msgDragOver(e) { e.preventDefault(); document.getElementById('msgDropHint')?.classList.add('show'); }
function msgDragLeave() { document.getElementById('msgDropHint')?.classList.remove('show'); }
function msgDrop(e) { e.preventDefault(); msgDragLeave(); if (e.dataTransfer?.files?.length) sendFiles(e.dataTransfer.files); }

// ══════════ 모달: 멤버 보기 · 1:1 · 그룹 ══════════
let mOkFn = null;
function openModal(title, body, onOk) {
  document.getElementById('mTitle').textContent = title; document.getElementById('mBody').innerHTML = body;
  mOkFn = onOk || null; document.getElementById('mOk').style.display = onOk ? '' : 'none';
  document.getElementById('modal').classList.add('active');
  const f = document.querySelector('#mBody input.fi'); if (f) f.focus();
}
function closeModal() { document.getElementById('modal').classList.remove('active'); mOkFn = null; }
document.getElementById('mOk').onclick = () => mOkFn && mOkFn();
document.getElementById('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && !e.isComposing && mOkFn && e.target.matches('#mBody input.fi')) { e.preventDefault(); mOkFn(); }
});
const userLine = (u) => `<div><div style="font-weight:700;font-size:13.5px">${esc(u.name)} ${esc(u.title || '')}</div><div style="font-size:11.5px;color:var(--text-light)">${esc(u.dept || '')}</div></div>`;

function showMembers(cid) {
  const ch = getChannel(cid), list = chMembers(ch), pm = ch.type === 'project' ? S.projects.find((p) => p.id === ch.projectId)?.pm : null;
  openModal(`${chLabel(ch)} 참여 멤버 (${list.length}명)`, `<div style="max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:6px">${list.length ? list.map((u) => `<div class="member-row"><div style="display:flex;align-items:center;gap:10px">${avatar(u)}<div><div style="font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:6px"><span>${esc(u.name)} ${esc(u.title || '')}</span>${pm && u.id === pm ? '<span class="b-pill orange">PM</span>' : ''}${u.id === me.uid ? '<span class="b-pill blue">나</span>' : ''}</div><div style="font-size:11.5px;color:var(--text-light)">${esc(u.dept || '소속 없음')}</div></div></div>${u.id && u.id !== me.uid ? `<button class="btn btn-sm" onclick="startDM('${esc(u.id)}')">1:1 대화</button>` : ''}</div>`).join('') : '<div class="empty">등록된 참여 멤버가 없습니다.</div>'}</div>`);
}
function openNewDM() {
  const others = [SANCHO_USER, ...activeUsers().filter((u) => u.id !== me.uid)];
  openModal('1:1 대화 상대 선택', `<div style="max-height:340px;overflow-y:auto">${others.map((u) => `<div class="msg-pick" onclick="startDM('${esc(u.id)}')">${avatar(u)}${userLine(u)}</div>`).join('')}</div>`);
}
async function startDM(otherId) {
  let dm = S.channels.find((c) => c.type === 'dm' && (c.members || []).includes(me.uid) && (c.members || []).includes(otherId));
  if (!dm && otherId === 'sancho') dm = { id: SANCHO_DM };   // 산초 DM 은 고정 가상 채널 — 첫 방문에 markRead 가 문서로 굳힌다
  if (!dm) {
    dm = { id: 'dm' + Date.now(), name: 'DM', type: 'dm', members: [me.uid, otherId] };
    try { await setDoc(doc(db, 'channels', dm.id), { name: dm.name, type: dm.type, members: dm.members }); S.channels.push(dm); } catch (e) { return toast('채팅방 생성 실패: ' + e.message, 'err'); }
  }
  closeModal(); setCh(dm.id);
}
function openNewGroup() {
  const others = [SANCHO_USER, ...activeUsers().filter((u) => u.id !== me.uid)];
  openModal('새 그룹 채팅', `
    <div class="fg"><label class="fl">그룹 이름</label><input class="fi" id="grpName" placeholder="예: 품질 개선 TF"></div>
    <div class="fg"><label class="fl">참여 멤버</label><div style="max-height:240px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:6px">
      ${others.map((u) => `<label class="msg-pick"><input type="checkbox" name="grpMember" value="${esc(u.id)}">${avatar(u)}${userLine(u)}</label>`).join('')}
      ${others.length > 1 ? '' : '<div class="sec-empty">등록된 사용자가 없습니다. 조직 메뉴에서 추가해 주세요.</div>'}
    </div></div>`, async () => {
    const name = document.getElementById('grpName').value.trim(), members = [...document.querySelectorAll('input[name=grpMember]:checked')].map((c) => c.value);
    if (!name) return toast('그룹 이름을 입력해 주세요', 'err');
    if (!members.length) return toast('멤버를 1명 이상 선택해 주세요', 'err');
    const grp = { id: 'g' + Date.now(), name, type: 'group', members: [me.uid, ...members] };
    try { await setDoc(doc(db, 'channels', grp.id), { name, type: 'group', members: grp.members }); S.channels.push(grp); closeModal(); setCh(grp.id); }
    catch (e) { toast('그룹 생성 실패: ' + e.message, 'err'); }
  });
}

// ══════════ 시작: 다섯 컬렉션 구독 → 그리기 ══════════
async function boot() {
  const sub = (col, cb) => onSnapshot(collection(db, col), (snap) => { S[col] = snap.docs.map((d) => ({ id: d.id, ...d.data() })); cb && cb(); renderKeepInput(); }, (e) => console.error(col + ' 구독 오류', e));
  sub('users'); sub('depts'); sub('projects'); sub('channels');
  onSnapshot(query(collection(db, 'messages'), orderBy('ts', 'desc'), limit(500)), (snap) => {   // 최근 500개(원본과 같음), 화면은 오래된 순
    S.messages = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => ms(a.ts) - ms(b.ts)); renderKeepInput(); autoRead();
  }, (e) => console.error('messages 구독 오류', e));
  render();
}
</script></body></html>
