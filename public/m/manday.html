<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>산초 · 공수 관리</title>

<script src="/m/sdb.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js" onload="window.chartReady && window.chartReady()"></script>
<style>
/* 공수 관리 — 세종 플랫폼 v2 modules/manday-tracker/manday-tracker.html 이식. 색은 전부 platform.css 변수 */

</style>
</head><body><div class="content-pad" id="root"></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="modal"><div class="modal">
  <div class="modal-head"><div class="modal-title" id="mTitle"></div><button class="btn btn-sm btn-ghost" data-close>✕</button></div>
  <div class="modal-body" id="mBody"></div>
  <div class="modal-foot"><button class="btn" data-close>취소</button><button class="btn btn-primary" id="mOk">저장</button></div>
</div></div>
<script>
const { db, doc, collection, getDoc, getDocs, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot, query, where, orderBy, limit, writeBatch } = window.fb;
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = (t, kind = '') => { const el = document.getElementById('toast'); el.textContent = t; el.className = 'toast on ' + kind; clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2200); };
window.addEventListener('message', (e) => { if (e.data?.sancho && e.data.act === 'theme') document.documentElement.dataset.theme = e.data.theme || ''; });
let me = null;                                  // 주인(단일 사용자): {uid:'owner', name, title, dept, email}

const $ = (s) => document.querySelector(s);
const v = (s) => ($(s) ? $(s).value : '').trim();
const S = { rows: [], projects: [], users: [], ready: false };   // onSnapshot 이 채운다 — 별도 캐시 없음
const V = { tab: 'sum', period: 'month', from: '', to: '', user: '', proj: '', sort: 'date', dir: -1, draft: '', preview: null };
const charts = {};

// ── 날짜 · 계산 (순수) ──
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const shift = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const num = (x) => { const n = Number(x); return isFinite(n) ? n : 0; };
const MD = (r, o) => Math.round((num(r) + num(o)) / 8 * 100) / 100;          // M/D = (정규+야근) ÷ 8
const rowMd = (e) => (e && e.md != null && e.md !== '') ? num(e.md) : MD(e && e.regular, e && e.overtime);
const f1 = (n) => (Math.round(n * 10) / 10).toFixed(1);
const f2 = (n) => (Math.round(n * 100) / 100).toFixed(2);

function range() {
  const d = new Date();
  if (V.period === 'week') { const g = d.getDay(), mon = new Date(d); mon.setDate(d.getDate() - (g === 0 ? 6 : g - 1)); const sun = new Date(mon); sun.setDate(mon.getDate() + 6); return { from: ymd(mon), to: ymd(sun), name: '이번 주' }; }
  if (V.period === 'month') return { from: ymd(new Date(d.getFullYear(), d.getMonth(), 1)), to: ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0)), name: '이번 달' };
  if (V.period === 'last') return { from: ymd(new Date(d.getFullYear(), d.getMonth() - 1, 1)), to: ymd(new Date(d.getFullYear(), d.getMonth(), 0)), name: '지난 달' };
  return { from: V.from, to: V.to, name: '직접 선택' };
}

// ══════════ 카톡식 한 줄 파서 (원본 parseLine 627-666 — 순수 함수, selfCheck() 가 검사한다) ══════════
// 예) "9/15 SJ456-25 삼성전기, V-103 외관검사 정규8시간 야근2시간"
//     날짜(오늘·어제·9/15·2026-09-15) + 쉼표 앞 = 프로젝트 코드·고객, 쉼표 뒤 = 작업, 시간은 어디에 있어도 뽑는다.
const CODE_RE = /^[A-Za-z][A-Za-z0-9]*-[A-Za-z0-9-]+$/;                      // 영문+숫자+하이픈 (SJ456-25, ABC-12-1)
function parseLine(text) {
  const raw = String(text ?? '').trim();
  if (!raw) return { error: '빈 줄입니다.', raw };
  let s = raw, date = today(), m;
  if ((m = s.match(/^(오늘|어제|그저께|엊그제)[\s,]+/))) { date = shift(m[1] === '오늘' ? 0 : m[1] === '어제' ? -1 : -2); s = s.slice(m[0].length); }
  else if ((m = s.match(/^(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})[\s,]+/))) { date = `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`; s = s.slice(m[0].length); }
  else if ((m = s.match(/^(\d{1,2})[\/.](\d{1,2})[\s,]+/))) { date = `${new Date().getFullYear()}-${pad(+m[1])}-${pad(+m[2])}`; s = s.slice(m[0].length); }

  let regular = 0, overtime = 0;
  s = s.replace(/정규\s*(\d+(?:\.\d+)?)\s*(?:시간|h)?/gi, (_, n) => { regular += parseFloat(n); return ' '; });
  s = s.replace(/(?:야근|잔업|연장|초과|OT)\s*(\d+(?:\.\d+)?)\s*(?:시간|h)?/gi, (_, n) => { overtime += parseFloat(n); return ' '; });
  if (!regular && !overtime) s = s.replace(/(\d+(?:\.\d+)?)\s*(?:시간|h)(?![가-힣A-Za-z0-9])/i, (_, n) => { regular = parseFloat(n); return ' '; });

  const parts = s.split(',').map((x) => x.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const t1 = (parts[0] || '').split(' ').filter(Boolean);
  let projectCode = '', client = '', task = '';
  if (t1.length && CODE_RE.test(t1[0])) projectCode = t1.shift();
  if (parts.length > 1) { client = t1.join(' '); task = parts.slice(1).join(' ').replace(/\s+/g, ' ').trim(); }
  else task = t1.join(' ');

  if (!projectCode) return { error: '프로젝트 코드를 찾지 못했습니다. (예: SJ456-25)', raw };
  if (!regular && !overtime) return { error: '시간을 찾지 못했습니다. (예: 정규8시간 야근2시간, 4시간)', raw };
  return { date, projectCode, client, task, regular, overtime, md: MD(regular, overtime), raw };
}

// 파서 자가검사 — /m/manday.html?selftest 로 열면 콘솔에 결과를 찍는다 (probe.js 가 이 주소를 연다)
function selfCheck() {
  const Y = new Date().getFullYear(), T = [];
  const eq = (name, got, want) => T.push({ name, ok: JSON.stringify(got) === JSON.stringify(want), got, want });
  let r;
  r = parseLine('SJ456-25 삼성전기, V-103 외관검사 정규8시간 야근2시간');
  eq('1 기본 한 줄', [r.projectCode, r.client, r.task, r.regular, r.overtime, r.md], ['SJ456-25', '삼성전기', 'V-103 외관검사', 8, 2, 1.25]);
  r = parseLine('SJ501-26 LG화학, 열교환기 수압시험 정규8h 야근1.5h');
  eq('2 h 단위·소수', [r.regular, r.overtime, r.md], [8, 1.5, 1.19]);
  r = parseLine('SJ512-26 한화, 도면 검토 정규 8 야근 2');
  eq('3 단위 없는 야근', [r.regular, r.overtime, r.task], [8, 2, '도면 검토']);
  r = parseLine('SJ512-26 한화, 자재 입고 검사 정규6시간 연장 1.5');
  eq('4 연장 표기', [r.regular, r.overtime, r.md], [6, 1.5, 0.94]);
  r = parseLine('SJ456-25 삼성전기, 성적서 편철 4시간');
  eq('5 단독 N시간 = 정규', [r.regular, r.overtime, r.md], [4, 0, 0.5]);
  r = parseLine('9/15 SJ456-25 삼성전기, 외관검사 정규8시간');
  eq('6 9/15 날짜 앞머리', r.date, `${Y}-09-15`);
  r = parseLine('오늘 SJ456-25 삼성전기, 외관검사 8시간');
  eq('7 오늘', r.date, today());
  r = parseLine('어제 SJ456-25 삼성전기, 외관검사 8시간');
  eq('8 어제', r.date, shift(-1));
  r = parseLine('SJ456-25 외관검사 정규8시간');
  eq('9 쉼표 없는 줄', [r.projectCode, r.client, r.task], ['SJ456-25', '', '외관검사']);
  eq('10 시간 없음 = 오류', !!parseLine('SJ456-25 삼성전기, 외관검사').error, true);
  eq('11 코드 없음 = 오류', !!parseLine('외관검사 정규8시간').error, true);
  eq('12 빈 줄 = 오류', !!parseLine('   ').error, true);
  const fail = T.filter((t) => !t.ok);
  fail.forEach((t) => console.log(`FAIL ${t.name} → ${JSON.stringify(t.got)} ≠ ${JSON.stringify(t.want)}`));
  console.log(`파서 자가검사 ${T.length - fail.length}/${T.length} ${fail.length ? 'FAIL' : 'PASS'}`);
  return !fail.length;
}
if (location.search.includes('selftest')) selfCheck();

// ── 조회 헬퍼 ──
const projById = (id) => S.projects.find((p) => p.id === id);
const projByCode = (c) => S.projects.find((p) => p.code === c);
const projOf = (e) => projById(e.projectId) || projByCode(e.projectCode);
const projLabel = (e) => { const p = projOf(e); return (e.projectCode || (p && p.code) || '') + (p && p.name ? ' · ' + p.name : ''); };
const uName = (id) => { const u = S.users.find((x) => x.id === id); return (u && u.name) || (id === 'owner' && me ? me.name : '') || id || ''; };
const myId = () => (me && me.uid) || 'owner';

function filtered() {
  const r = range();
  return S.rows.filter((e) => {
    if (!e || !e.date) return false;
    if (r.from && e.date < r.from) return false;
    if (r.to && e.date > r.to) return false;
    if (V.user && e.userId !== V.user) return false;
    if (V.proj && (e.projectCode || '') !== V.proj) return false;
    return true;
  });
}
const SORTV = { date: (e) => e.date || '', userName: (e) => uName(e.userId) || e.userName || '', projectCode: (e) => e.projectCode || '', task: (e) => e.task || '', regular: (e) => num(e.regular), overtime: (e) => num(e.overtime), md: (e) => rowMd(e) };
function sorted(rows) {
  const g = SORTV[V.sort] || SORTV.date;
  return [...rows].sort((a, b) => { const x = g(a), y = g(b); const c = typeof x === 'number' ? x - y : String(x).localeCompare(String(y)); return (c || String(a.id).localeCompare(String(b.id))) * V.dir; });
}

// ── 산초에게 ──
function askLog() {
  const t = today();
  SANCHO.ask(`data/db/manday.json 에 오늘 공수를 기록해줘: 오늘(${t}) 내가(${(me && me.name) || '주인'}, userId "owner") 한 일을 캘린더(data/db/events.json)·업무(data/db/tasks.json)·회의(data/db/meetings.json)·메일(data/db/mail.json)에서 찾아 프로젝트별로 나누고, platform 스킬의 manday 규격(date "${t}", userId, userName, projectId = data/db/projects.json 의 문서 id, projectCode = 그 프로젝트의 code, task(무엇을 했는지 한 줄), regular(정규 시간 number), overtime(야근 시간 number), md = (regular+overtime)/8, memo, raw)으로 새 문서를 추가해줘. 하루 정규 합이 8시간을 넘지 않게 나누고, 근거가 없는 프로젝트는 추측하지 말고 나에게 물어봐줘. 기존 문서는 고치지 말고 새 id 로 추가만 해줘.`);
}
function askSum() {
  const r = range();
  SANCHO.ask(`data/db/manday.json 의 ${r.from || '처음'} ~ ${r.to || '오늘'} 공수를 집계해서 요약해줘: (1) 프로젝트별 M/D 합계(projects.json 의 name 을 붙여서), (2) 담당자별 M/D 와 야근 시간, (3) 야근 시간 총합과 야근이 몰린 사람·프로젝트, (4) 투입이 가장 많은 프로젝트 3개를 표로 만들어줘. 그리고 지난 달 같은 기간과 비교해 늘고 준 것을 세 줄로 알려줘. 집계 결과는 대화로만 보고하고 db 파일은 고치지 말아줘.`);
}

// ══════════ 화면 ══════════
function render() {
  if (!S.ready) return;
  const r = range(), rows = filtered();
  const root = $('#root');
  root.innerHTML = head() + (V.tab === 'sum' ? viewSum(r, rows) : viewIn());
  if (V.tab === 'in') { const ta = $('#kakao'); if (ta) ta.value = V.draft; }
  if (V.tab === 'sum') drawCharts(rows);
}
function head() {
  return `<div class="mod-head">
    <div><div class="mod-title">🗓 공수 관리</div><div class="mod-sub">카톡처럼 한 줄로 붙여넣으면 프로젝트·작업·시간을 뽑아 M/D 로 집계합니다 · M/D = (정규 + 야근) ÷ 8</div></div>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-ai" data-act="ai-log" title="오늘 한 일을 산초가 찾아 공수로 기록합니다">✳ 산초에게 · 오늘 공수 기록</button>
      <button class="btn btn-ai" data-act="ai-sum" title="선택한 기간의 공수를 산초가 집계해 요약합니다">✳ 산초에게 · 집계 요약</button>
      <button class="btn" data-act="csv-out">📥 CSV 내보내기</button>
      <button class="btn" data-act="csv-in">📋 CSV 붙여넣기</button>
      <button class="btn btn-primary" data-act="row-new">＋ 공수 입력</button>
    </div></div>
  <div class="tabs">
    <div class="tab ${V.tab === 'sum' ? 'on' : ''}" data-act="tab" data-v="sum">📈 집계 · 상세</div>
    <div class="tab ${V.tab === 'in' ? 'on' : ''}" data-act="tab" data-v="in">⚡ 입력</div>
  </div>`;
}

// ── 집계 탭 ──
function viewSum(r, rows) {
  if (!S.rows.length) return `<div class="empty"><h3>기록된 공수가 없습니다</h3>
    카톡에 쓰듯 <b>“SJ456-25 삼성전기, V-103 외관검사 정규8시간 야근2시간”</b> 한 줄을 붙여넣으면 그대로 저장됩니다.<br>오늘 한 일을 산초가 대신 찾아 기록하게 할 수도 있습니다.
    <div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-primary" data-act="tab" data-v="in">⚡ 한 줄 붙여넣기</button>
      <button class="btn btn-ai" data-act="ai-log">✳ 산초에게: 오늘 공수 기록해줘</button></div></div>`;
  const totMd = rows.reduce((a, e) => a + rowMd(e), 0);
  const myMd = rows.filter((e) => e.userId === myId()).reduce((a, e) => a + rowMd(e), 0);
  const totOt = rows.reduce((a, e) => a + num(e.overtime), 0);
  const totReg = rows.reduce((a, e) => a + num(e.regular), 0);
  const codes = [...new Set(rows.map((e) => e.projectCode).filter(Boolean))];
  const users = [...new Set(S.rows.map((e) => e.userId).filter(Boolean))];
  const allCodes = [...new Set(S.rows.map((e) => e.projectCode).filter(Boolean))].sort();
  const opt = (val, label, sel) => `<option value="${esc(val)}" ${sel ? 'selected' : ''}>${esc(label)}</option>`;
  const seg = (k, label) => `<button class="${V.period === k ? 'on' : ''}" data-act="period" data-v="${k}">${label}</button>`;

  // 프로젝트별 집계 (원본 #project-summary-table — 한 번도 채워지지 않던 표를 여기서 구현)
  const byProj = {};
  rows.forEach((e) => { const k = e.projectCode || '(코드 없음)'; const g = byProj[k] || (byProj[k] = { code: k, name: (projOf(e) || {}).name || '', reg: 0, ot: 0, md: 0, n: 0, who: new Set() }); g.reg += num(e.regular); g.ot += num(e.overtime); g.md += rowMd(e); g.n++; if (e.userId) g.who.add(e.userId); });
  const projRows = Object.values(byProj).sort((a, b) => b.md - a.md);

  return `<div class="toolbar">
    <div class="seg">${seg('week', '이번 주')}${seg('month', '이번 달')}${seg('last', '지난 달')}${seg('custom', '직접')}</div>
    ${V.period === 'custom' ? `<input class="fi" type="date" id="qFrom" style="width:150px" value="${esc(V.from)}"> ~ <input class="fi" type="date" id="qTo" style="width:150px" value="${esc(V.to)}">` : `<span class="fh" style="margin:0">${esc(r.from)} ~ ${esc(r.to)}</span>`}
    <select class="fs" id="qUser" style="width:auto">${opt('', '담당: 전체', !V.user)}${users.map((u) => opt(u, uName(u), V.user === u)).join('')}</select>
    <select class="fs" id="qProj" style="width:auto">${opt('', '프로젝트: 전체', !V.proj)}${allCodes.map((c) => opt(c, c + ((projByCode(c) || {}).name ? ' · ' + projByCode(c).name : ''), V.proj === c)).join('')}</select>
    <span class="sp"></span><span class="fh" style="margin:0">${rows.length}건 / 전체 ${S.rows.length}건</span>
  </div>
  <div class="kpi-grid">

// CSV 붙여넣기 복원 — 내보낸 CSV(또는 엑셀에서 복사한 표)를 그대로 붙여넣으면 되돌린다
function csvRows(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',' || c === '\t') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); cur = ''; rows.push(row); row = []; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.map((r) => r.map((x) => x.trim())).filter((r) => r.some(Boolean));
}
function openCsvModal() {
  openModal('CSV 붙여넣기 복원', `<div class="fh" style="margin-bottom:8px">내보낸 CSV 파일을 열어 전체 복사해 붙여넣으세요. 열 순서: <b>날짜, 담당, 프로젝트코드, 프로젝트명, 작업, 정규(h), 야근(h), M/D, 비고</b> · 첫 줄이 머리글이면 건너뜁니다. 기존 기록은 지우지 않고 <b>추가</b>됩니다.</div>
    <textarea class="ft" id="csvIn" style="min-height:180px;font-family:ui-monospace,Consolas,monospace;font-size:12px" placeholder="날짜,담당,프로젝트코드,..."></textarea>`, async () => {
    const rows = csvRows(($('#csvIn') || {}).value || '');
    if (!rows.length) return toast('붙여넣은 내용이 없습니다.', 'err');
    if (rows[0][0] === '날짜') rows.shift();
    const list = rows.map((r) => {
      const regular = num(r[5]), overtime = num(r[6]), code = r[2] || '';
      const u = S.users.find((x) => x.name === r[1]);
      return { date: r[0] || today(), userId: (u && u.id) || myId(), userName: r[1] || (me && me.name) || '', projectId: (projByCode(code) || {}).id || '',
        projectCode: code, task: r[4] || '', regular, overtime, md: MD(regular, overtime), memo: r[8] || '', raw: '' };
    }).filter((d) => /^\d{4}-\d{2}-\d{2}$/.test(d.date) && (d.regular || d.overtime));
    if (!list.length) return toast('읽을 수 있는 줄이 없습니다. 날짜는 YYYY-MM-DD 형식이어야 합니다.', 'err');
    try { await saveRows(list); closeModal(); toast(`${list.length}건을 복원했습니다`, 'ok'); } catch (e) { toast('복원 실패: ' + e.message, 'err'); }
  }, true);
}

async function boot() {
  const docs = (s) => s.docs.map((d) => ({ id: d.id, ...d.data() }));
  onSnapshot(collection(db, 'manday'), (s) => { S.rows = docs(s); S.ready = true; render(); }, (e) => { S.ready = true; toast('공수 읽기 실패: ' + e.message, 'err'); render(); });
  onSnapshot(collection(db, 'projects'), (s) => { S.projects = docs(s).filter((p) => !p.hidden).sort((a, b) => String(a.code).localeCompare(String(b.code))); render(); });
  onSnapshot(collection(db, 'users'), (s) => { S.users = docs(s).sort((a, b) => (a.id === 'owner' ? -1 : b.id === 'owner' ? 1 : 0)); render(); });
}
window.fb.me().then((u) => { me = u; boot(); });
</script></body></html>
