<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>산초 · 프로젝트</title>
<link rel="stylesheet" href="/m/platform.css">
<script src="/m/sdb.js"></script>
<style>
/* 세종 플랫폼 프로젝트 카드(.proj)·통합 타임라인(.utl-*)·칸반(.task) 은 platform.css 에 있다. 여기는 이 화면만의 보강 */
.mod-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.fg.row > .fg { margin-bottom: 0; }
.proj { border-left: 4px solid var(--pc, var(--border)); }
.proj-gantt-bar { position: absolute; top: 9px; height: 20px; border-radius: 3px; background: var(--border-light); overflow: hidden; min-width: 3px; }
.proj-gantt-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--pc, var(--primary)); opacity: .85; }
.proj-gantt-lbl { position: absolute; inset: 0; font-size: 10px; line-height: 20px; text-align: center; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; }
.proj-nowbs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 11px; color: var(--text-lighter); margin: 2px 0 8px; }
.utl-year { display: inline-flex; align-items: center; gap: 4px; }
.utl-year b { min-width: 56px; text-align: center; font-size: 13px; }
.task.okr { background: var(--primary-lighter); border-style: dashed; }
.task-due.over { color: var(--danger); font-weight: 700; }
.modal-foot .left { margin-right: auto; }
</style>
</head><body><div class="content-pad" id="root"></div>
<div class="overlay" id="modal"><div class="modal"><div class="modal-head"><div class="modal-title" id="mTitle"></div><button class="icon-btn" data-close title="닫기">✕</button></div><div class="modal-body" id="mBody"></div><div class="modal-foot"><button class="btn btn-danger left" id="mDel" hidden>🗑 삭제</button><button class="btn" data-close>취소</button><button class="btn btn-primary" id="mOk">저장</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const { db, doc, collection, setDoc, updateDoc, deleteDoc, onSnapshot } = window.fb;
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = (t, kind = '') => { const el = document.getElementById('toast'); el.textContent = t; el.className = 'toast on ' + kind; clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2200); };
window.addEventListener('message', (e) => { if (e.data?.sancho && e.data.act === 'theme') document.documentElement.dataset.theme = e.data.theme || ''; });
let me = null;
window.fb.me().then((u) => { me = u; boot(); });

// ── 상태 ──
const S = { projects: [], tasks: [], okrs: [], users: [], wbs: {}, wbsLoaded: false };   // wbs: GET /api/wbs 목록 → {이름: {pct, late, spi, items}}
const UI = { tab: 'proj', filter: 'all', showHidden: false, year: new Date().getFullYear(), taskProj: '' };
try { if (localStorage.pj_tab === 'tasks') UI.tab = 'tasks'; } catch {}
{ const q = new URLSearchParams(location.search).get('tab'); if (q === 'tasks' || q === 'proj') UI.tab = q; }   // ?tab=tasks 로 업무 보드 바로 열기
const STATUS = { plan: ['예정', 'gray', 'var(--text-lighter)'], active: ['진행중', 'blue', 'var(--primary)'], hold: ['보류', 'orange', 'var(--warning)'], done: ['완료', 'green', 'var(--success)'] };
const COLORS = { blue: 'var(--primary)', green: 'var(--success)', orange: 'var(--warning)', red: 'var(--danger)', purple: 'var(--purple)', gray: 'var(--text-lighter)' };
const COLOR_LABEL = { blue: '파랑', green: '초록', orange: '주황', red: '빨강', purple: '보라', gray: '회색' };
const COLS = [['todo', '할 일'], ['doing', '진행 중'], ['review', '검토'], ['done', '완료']];
const stMeta = (p) => STATUS[p.status] || STATUS.active;
const colorOf = (p) => COLORS[p.color] || stMeta(p)[2];
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const userList = () => S.users.length ? S.users : [{ id: me.uid, name: me.name }];
const userName = (id) => { if (!id) return '미지정'; const u = S.users.find((u) => u.id === id); return u ? u.name : id === me?.uid ? me.name : id; };   // users 에 없으면 직접 입력한 이름으로 본다
const projOf = (id) => S.projects.find((p) => p.id === id);
const wbsOf = (p) => p.wbs ? S.wbs[p.wbs] : null;
const pctOf = (p) => { const w = wbsOf(p); return w ? Math.round(Number(w.pct) || 0) : typeof p.progress === 'number' ? Math.round(p.progress) : null; };
const pctPos = (ms, ys, span) => (ms - ys) / span * 100;
const MONTHS = (cls, suf) => Array.from({ length: 12 }, (_, i) => `<div class="${cls}">${i + 1}${suf}</div>`).join('');

// ── 공정표 목록: 20초마다 + projects 가 바뀔 때. 원본 reconcileProjectProgress 처럼 진도율을 문서 progress 로 되써넣는다 ──
async function loadWbs() {
  try { const list = await SANCHO.api('/api/wbs'); S.wbs = Object.fromEntries((Array.isArray(list) ? list : []).map((w) => [w.name, w])); S.wbsLoaded = true; } catch {}
  reconcile(); render();
}
function reconcile() {
  for (const p of S.projects) { const w = wbsOf(p); if (!w) continue; const pct = Math.round(Number(w.pct) || 0); if (p.progress !== pct) updateDoc(doc(db, 'projects', p.id), { progress: pct }).catch(() => {}); }
}

// ── 그리기 ──
function render() {
  const proj = UI.tab === 'proj';
  document.getElementById('root').innerHTML = `
    <div class="mod-head"><div><div class="mod-title">프로젝트</div><div class="mod-sub">${proj ? '카드를 누르면 공정표(WBS)·간트로 들어가요' : '카드를 끌어 열을 옮기면 상태가 바뀌어요 · 카드를 누르면 수정'}</div></div>
      <div class="mod-actions"><button class="btn btn-ai" data-act="${proj ? 'ask-new' : 'ask-task'}">✳ 산초에게 시키기</button>${proj ? '<button class="btn btn-primary" data-act="new-proj">+ 신규 프로젝트</button>' : '<button class="btn btn-primary" data-act="new-task">+ 업무 추가</button>'}</div></div>
    <div class="tabs"><div class="tab ${proj ? 'on' : ''}" data-act="tab" data-tab="proj">프로젝트</div><div class="tab ${proj ? '' : 'on'}" data-act="tab" data-tab="tasks">업무 보드</div></div>
    ${proj ? renderProjects() : renderTasks()}`;
}
function renderProjects() {
  const all = S.projects, hiddenN = all.filter((p) => p.hidden).length;
  if (!all.length) return `<div class="empty"><h3>아직 프로젝트가 없어요</h3>프로젝트를 만들고 공정표(WBS)를 붙이면 진도율·간트·연간 일정 요약이 여기 그려져요.<div class="mod-actions" style="justify-content:center;margin-top:14px"><button class="btn btn-primary" data-act="new-proj">+ 신규 프로젝트</button><button class="btn btn-ai" data-act="ask-new">✳ 산초에게 시키기</button></div></div>`;
  let list = UI.showHidden ? all : all.filter((p) => !p.hidden);
  if (UI.filter !== 'all') list = list.filter((p) => (p.status || 'active') === UI.filter);
  list = [...list].sort((a, b) => String(a.start || '').localeCompare(String(b.start || '')) || String(a.code || '').localeCompare(String(b.code || '')));
  const vis = all.filter((p) => !p.hidden), ym = today().slice(0, 7);
  const kpi = [['진행 중', vis.filter((p) => (p.status || 'active') === 'active').length, ''], ['완료', vis.filter((p) => p.status === 'done').length, 'green'],
    ['지연 공정표', vis.filter((p) => (wbsOf(p)?.late || 0) > 0).length, 'red'], ['이번 달 마감', vis.filter((p) => p.status !== 'done' && String(p.end || '').slice(0, 7) === ym).length, 'orange']];
  const seg = [['all', '전체'], ['active', '진행중'], ['done', '완료'], ['hold', '보류'], ['plan', '예정']];
  return `
    <div class="kpi-grid">${kpi.map(([l, v, c]) => `<div class="kpi"><div class="kpi-label">${l}</div><div class="kpi-value ${c}">${v}</div></div>`).join('')}</div>
    <div class="toolbar"><div class="seg">${seg.map(([v, l]) => `<button class="${UI.filter === v ? 'on' : ''}" data-act="filter" data-v="${v}">${l}</button>`).join('')}</div><span class="sp"></span>
      ${hiddenN ? `<button class="btn btn-sm" data-act="toggle-hidden">${UI.showHidden ? '🙈 숨김 감추기' : '👁 숨김 보기'} ${hiddenN}</button>` : ''}</div>
    ${list.length ? `<div class="proj-grid">${list.map(card).join('')}</div>` : '<div class="empty">이 조건에 맞는 프로젝트가 없어요.</div>'}
    ${timeline(list)}`;
}
function card(p) {
  const [label, pill] = stMeta(p), pct = pctOf(p), w = wbsOf(p), col = colorOf(p), id = esc(p.id);
  const y = new Date().getFullYear(), ys = Date.parse(`${y}-01-01`), span = Date.parse(`${y + 1}-01-01`) - ys, s = Date.parse(p.start), e = Date.parse(p.end);
  const l = Math.max(0, Math.min(100, pctPos(s, ys, span))), r = Math.max(0, Math.min(100, pctPos(e, ys, span)));
  const bar = isNaN(s) || isNaN(e) || r <= l ? '' : `<div class="proj-gantt-bar" style="left:${l}%;width:${Math.max(1, r - l)}%"><div class="proj-gantt-fill" style="width:${pct ?? 0}%"></div><div class="proj-gantt-lbl">${esc(p.code || '')}</div></div>`;
  const members = Array.isArray(p.members) ? p.members.length : 0;
  return `<div class="proj ${p.hidden ? 'proj-hidden' : ''}" data-act="open" data-id="${id}" style="--pc:${col}">
    <button class="proj-hide-btn" data-act="hide" data-id="${id}" title="${p.hidden ? '숨김 취소' : '숨김'}">${p.hidden ? '🚫' : '👁'}</button>
    <button class="proj-edit-btn" data-act="edit" data-id="${id}" title="수정">✏</button>
    <button class="proj-del-btn" data-act="del" data-id="${id}" title="삭제">🗑</button>
    <div class="proj-open-hint">→ 열기</div>
    <div class="proj-code">${esc(p.code || '-')}</div>
    <div class="proj-name">${esc(p.name || '(이름 없음)')}</div>
    <div class="proj-meta"><span>${esc(p.client || '-')}</span><span class="b-pill ${pill}">${label}</span></div>
    <div class="proj-meta"><span>PM ${esc(userName(p.pm))}${members ? ` · 팀 ${members}` : ''}</span><span>${pct == null ? '' : `<b>${pct}%</b>`}${w?.late ? ` <span class="b-pill red">지연 ${w.late}</span>` : ''}</span></div>
    ${pct == null ? '' : `<div class="bar"><div class="bar-fill" style="width:${pct}%;background:${col}"></div></div>`}
    ${w ? '' : `<div class="proj-nowbs">공정표 없음 <button class="btn btn-sm" data-act="mk-wbs" data-id="${id}">공정표 만들기</button><button class="btn btn-sm btn-ai" data-act="ask-wbs" data-id="${id}">✳ 산초에게 WBS 짜달라기</button></div>`}
    <div style="margin-top:6px;font-size:11px;color:var(--text-lighter)">${esc(p.start || '?')} ~ ${esc(p.end || '?')}${w ? ` · 작업 ${w.items ?? 0}개${w.spi != null ? ` · SPI ${w.spi}` : ''}` : ''}</div>
    <div class="proj-mini-gantt"><div class="proj-gantt-months">${MONTHS('proj-gantt-mcell', '')}</div><div class="proj-gantt-track">${bar}<div class="proj-gantt-today" style="left:${pctPos(Date.parse(today()), ys, span)}%"></div></div></div>
  </div>`;
}
function timeline(list) {   // 원본 renderUnifiedTimeline — 연도 선택 추가, 막대 색은 상태(또는 프로젝트 색)
  const y = UI.year, ys = Date.parse(`${y}-01-01`), ye = Date.parse(`${y + 1}-01-01`), span = ye - ys, tp = pctPos(Date.parse(today()), ys, span);
  const rows = list.filter((p) => { const s = Date.parse(p.start), e = Date.parse(p.end); return !isNaN(s) && !isNaN(e) && e >= ys && s < ye; });
  return `<div class="utl-wrap"><div class="utl-head"><div class="utl-title">📅 전체 프로젝트 일정 요약 <span style="font-size:11px;color:var(--text-lighter);font-weight:400;margin-left:6px">막대를 누르면 공정표로 들어가요</span></div>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div class="utl-legend">${Object.values(STATUS).map(([l, , c]) => `<span><span class="utl-dot" style="background:${c}"></span>${l}</span>`).join('')}<span><span class="utl-dot" style="background:var(--danger)"></span>오늘</span></div>
      <div class="utl-year"><button class="btn btn-sm" data-act="year" data-d="-1" title="이전 해">‹</button><b>${y}년</b><button class="btn btn-sm" data-act="year" data-d="1" title="다음 해">›</button></div></div></div>
    <div class="utl-grid"><div class="utl-month-row"><div class="utl-info utl-info-hdr">프로젝트 (${rows.length})</div><div class="utl-track utl-month-hdr">${MONTHS('utl-mcell', '월')}</div></div>
    ${rows.length ? rows.map((p) => { const l = Math.max(0, pctPos(Date.parse(p.start), ys, span)), r = Math.min(100, pctPos(Date.parse(p.end), ys, span)), pct = pctOf(p) ?? 0, col = colorOf(p);
      return `<div class="utl-row" data-act="open" data-id="${esc(p.id)}"><div class="utl-info"><div class="utl-code">${esc(p.code || '')}</div><div class="utl-name" title="${esc(p.name)}">${esc(p.name)}</div><div class="utl-meta">PM ${esc(userName(p.pm))} · <b>${pct}%</b> · ${esc(p.start)} ~ ${esc(p.end)}</div></div>
        <div class="utl-track">${tp >= 0 && tp <= 100 ? `<div class="utl-today" style="left:${tp}%"></div>` : ''}<div class="utl-bar" style="left:${l}%;width:${Math.max(1, r - l)}%;background:var(--border-light)"><div class="utl-bar-fill" style="width:${pct}%;background:${col}"></div><span class="utl-bar-label">${esc(p.code || '')} · ${pct}%</span></div></div></div>`; }).join('')
      : `<div style="padding:14px;text-align:center;font-size:12px;color:var(--text-lighter)">${y}년에 걸친 프로젝트가 없어요</div>`}</div></div>`;
}

// ── 업무 보드(칸반): tasks + OKR 마일스톤(마감 있는 것) 가상 카드 — 원본 allKanbanTasks/getOkrMilestoneVirtualTasks ──
function kanbanTasks() {
  const real = S.tasks.map((t) => ({ ...t, status: COLS.some(([k]) => k === t.status) ? t.status : 'todo' })), okr = [];
  for (const o of S.okrs) (Array.isArray(o.milestones) ? o.milestones : []).forEach((m, i) => { if (!m || !m.due) return;
    okr.push({ id: `okr:${o.id}:${i}`, okr: true, title: m.title || '(마일스톤)', due: m.due, assignee: m.who || o.ownerId, status: Number(m.pct) >= 100 ? 'done' : 'todo', sub: o.title || '목표', priority: 'mid' }); });
  let all = [...real, ...okr];
  if (UI.taskProj) all = all.filter((t) => t.projectId === UI.taskProj);
  return all.sort((a, b) => String(a.due || '9').localeCompare(String(b.due || '9')));
}
function renderTasks() {
  const all = kanbanTasks(), okrN = all.filter((t) => t.okr).length;
  if (!S.tasks.length && !okrN && !UI.taskProj) return `<div class="empty"><h3>아직 업무가 없어요</h3>업무를 추가하면 할 일 → 진행 중 → 검토 → 완료 로 끌어 옮길 수 있어요. 마감이 있는 OKR 마일스톤도 여기 함께 보여요.<div class="mod-actions" style="justify-content:center;margin-top:14px"><button class="btn btn-primary" data-act="new-task">+ 업무 추가</button><button class="btn btn-ai" data-act="ask-task">✳ 산초에게 시키기</button></div></div>`;
  return `<div class="toolbar"><select class="fs" style="width:auto" data-act="task-proj"><option value="">모든 프로젝트</option>${S.projects.filter((p) => !p.hidden || p.id === UI.taskProj).map((p) => `<option value="${esc(p.id)}" ${UI.taskProj === p.id ? 'selected' : ''}>${esc(p.code || '')} ${esc(p.name || '')}</option>`).join('')}</select>
      <span class="sp"></span><span style="font-size:12px;color:var(--text-light)">전체 ${all.length}건${okrN ? ` · OKR ${okrN}` : ''}</span></div>
    <div class="kanban">${COLS.map(([id, label]) => { const list = all.filter((t) => t.status === id);
      return `<div class="kb-col" data-col="${id}"><div class="kb-head"><span>${label}</span><span class="kb-count">${list.length}</span></div>${list.map(taskCard).join('')}</div>`; }).join('')}</div>`;
}
function taskCard(t) {
  const p = projOf(t.projectId), over = t.due && t.due < today() && t.status !== 'done';
  return `<div class="task ${esc(t.priority || 'mid')} ${t.status === 'done' ? 'done' : ''} ${t.okr ? 'okr' : ''}" draggable="true" data-id="${esc(t.id)}" data-act="${t.okr ? 'okr-open' : 'task-edit'}">
    ${t.okr ? `<div style="margin-bottom:4px"><span class="b-pill purple">OKR</span> <span style="font-size:10px;color:var(--text-lighter)">${esc(t.sub)}</span></div>` : t.source && t.source !== 'user' ? `<div style="margin-bottom:4px"><span class="b-pill gray">${esc(t.source)}</span></div>` : ''}
    <div class="task-title">${esc(t.title)}</div>
    <div class="task-meta"><span>${esc(p ? p.code : '')}</span><span>${esc(userName(t.assignee))}</span></div>
    ${t.due ? `<div class="task-meta" style="margin-top:4px"><span class="task-due ${over ? 'over' : ''}">마감 ${esc(t.due)}${over ? ' · 지남' : ''}</span></div>` : ''}</div>`;
}
async function moveTask(id, status) {
  try {
    if (id.startsWith('okr:')) {   // OKR 마일스톤 — okrs 문서 milestones[i].pct 를 100(완료) / 0(할 일)으로. 진행 중·검토 열은 없다
      const [, oid, i] = id.split(':'), o = S.okrs.find((x) => x.id === oid), ms = Array.isArray(o?.milestones) ? [...o.milestones] : [];
      if (!ms[i]) return; if (status === 'doing' || status === 'review') return toast('OKR 마일스톤은 할 일 ↔ 완료로만 옮길 수 있어요');
      if ((Number(ms[i].pct) >= 100) === (status === 'done')) return;
      ms[i] = { ...ms[i], pct: status === 'done' ? 100 : 0 }; await updateDoc(doc(db, 'okrs', oid), { milestones: ms });
    } else { const t = S.tasks.find((x) => x.id === id); if (!t || t.status === status) return; await updateDoc(doc(db, 'tasks', id), { status }); }
  } catch (err) { toast('이동 저장 실패: ' + err.message, 'err'); }
}

// ── 모달 ──
let onOk = null;
function openModal(title, body, ok, del) {
  document.getElementById('mTitle').textContent = title; document.getElementById('mBody').innerHTML = body; onOk = ok;
  const d = document.getElementById('mDel'); d.hidden = !del; d.onclick = del || null;
  document.getElementById('modal').classList.add('active'); document.querySelector('#mBody input, #mBody select, #mBody textarea')?.focus();
}
function closeModal() { document.getElementById('modal').classList.remove('active'); onOk = null; }
document.getElementById('mOk').onclick = () => onOk && onOk();
document.querySelectorAll('#modal [data-close]').forEach((b) => { b.onclick = closeModal; });
document.getElementById('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', (e) => { if (!document.getElementById('modal').classList.contains('active')) return;
  if (e.key === 'Escape') closeModal(); else if (e.key === 'Enter' && !e.isComposing && e.target.tagName !== 'TEXTAREA' && onOk) { e.preventDefault(); onOk(); } });
const fld = (id, label, inner) => `<div class="fg"><label class="fl" for="${id}">${label}</label>${inner}</div>`;
const inp = (id, v, type = 'text', ph = '') => `<input class="fi" id="${id}" type="${type}" value="${esc(v)}" placeholder="${esc(ph)}">`;
const sel = (id, v, opts) => `<select class="fs" id="${id}">${opts.map(([k, l]) => `<option value="${esc(k)}" ${v === k ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
const userOpts = () => userList().map((u) => [u.id, `${u.name || u.id}${u.title ? ' ' + u.title : ''}${u.dept ? ' · ' + u.dept : ''}`]);
const val = (id) => document.getElementById(id)?.value.trim() ?? '';

function openProject(p) {
  const isNew = !p; p = p || { pm: me.uid, status: 'active', start: today(), end: '' };
  const members = Array.isArray(p.members) ? p.members : [];
  openModal(isNew ? '+ 신규 프로젝트' : '✏ 프로젝트 수정', `
    <div class="fg row">${fld('pCode', '코드', inp('pCode', p.code || '', 'text', '예: 2026-031'))}${fld('pName', '이름', inp('pName', p.name || '', 'text', '예: 제독설비 제작'))}</div>
    ${fld('pClient', '고객', inp('pClient', p.client || ''))}
    <div class="fg row">${fld('pPm', 'PM', sel('pPm', p.pm || '', [['', '미지정'], ...userOpts()]))}${fld('pStatus', '상태', sel('pStatus', p.status || 'active', Object.entries(STATUS).map(([k, [l]]) => [k, l])))}</div>
    ${fld('pMembers', '팀원 (Ctrl 을 누르고 여러 명)', `<select class="fs" id="pMembers" multiple size="4">${userList().map((u) => `<option value="${esc(u.id)}" ${members.includes(u.id) ? 'selected' : ''}>${esc(u.name || u.id)}${u.title ? ' ' + esc(u.title) : ''}</option>`).join('')}</select>`)}
    <div class="fg row">${fld('pStart', '시작', inp('pStart', p.start || '', 'date'))}${fld('pEnd', '종료', inp('pEnd', p.end || '', 'date'))}</div>
    ${fld('pColor', '색', sel('pColor', p.color || '', [['', '상태 색 그대로'], ...Object.keys(COLORS).map((c) => [c, COLOR_LABEL[c]])]))}
    ${fld('pMemo', '메모', `<textarea class="ft" id="pMemo">${esc(p.memo || '')}</textarea>`)}
    ${p.wbs ? `<div class="fh">공정표 파일: wbs/${esc(p.wbs)}.json — 프로젝트를 삭제해도 파일은 남아요</div>` : ''}`,
  async () => {
    const code = val('pCode'), name = val('pName'); if (!code || !name) return toast('코드와 이름은 필수예요', 'err');
    const data = { code, name, client: val('pClient'), pm: val('pPm'), members: [...document.getElementById('pMembers').selectedOptions].map((o) => o.value), start: val('pStart'), end: val('pEnd'), status: val('pStatus'), color: val('pColor'), memo: val('pMemo') };
    try { if (isNew) await setDoc(doc(db, 'projects'), { ...data, hidden: false }); else await updateDoc(doc(db, 'projects', p.id), data); closeModal(); toast(isNew ? '프로젝트를 만들었어요' : '저장했어요', 'ok'); } catch (err) { toast(err.message, 'err'); }
  });
}
async function delProject(p) {
  if (!p || !confirm(`프로젝트 "${p.code || ''} ${p.name || ''}" 을 삭제할까요?\n${p.wbs ? `공정표 파일(wbs/${p.wbs}.json)은 남아요.` : ''}`)) return;
  try { await deleteDoc(doc(db, 'projects', p.id)); toast('삭제했어요', 'ok'); } catch (err) { toast(err.message, 'err'); }
}
function openWbs(p) { if (!p) return; if (p.wbs && (wbsOf(p) || !S.wbsLoaded)) location.href = `/wbs.html?p=${encodeURIComponent(p.wbs)}&embed=1`; else openProject(p); }
async function makeWbs(p) {   // 빈 공정표 파일 → 프로젝트 문서 wbs 필드에 이름
  if (!p) return; const name = p.wbs || p.name; if (!name) return toast('프로젝트 이름이 필요해요', 'err');
  try { await SANCHO.api('/api/wbs/save', { method: 'POST', body: JSON.stringify({ name, doc: { name, no: p.code || '', items: [] } }) });
    if (p.wbs !== name) await updateDoc(doc(db, 'projects', p.id), { wbs: name }); toast('빈 공정표를 만들었어요 — 산초에게 작업을 채워 달라고 하세요', 'ok'); loadWbs(); } catch (err) { toast('공정표 만들기 실패: ' + err.message, 'err'); }
}
const askWbs = (p) => p && SANCHO.ask(`wbs 스킬로 wbs/${p.name}.json 공정표를 만들어줘: 프로젝트 "${p.name}"(코드 ${p.code || '-'}, 고객 ${p.client || '-'}), 기간 ${p.start || '?'} ~ ${p.end || '?'}. 대단락(lv 0)과 작업(lv 1)을 이 기간 안에 배치하고 weight 합이 100이 되게 해줘. 만든 뒤 db/projects.json 의 "${p.id}" 문서에 wbs: "${p.name}" 을 써 넣어줘.${p.memo ? ' 메모: ' + p.memo : ''}`);
const askNew = () => SANCHO.ask('db/projects.json 에 프로젝트를 추가해줘: 코드 <코드>, 이름 <이름>, 고객 <고객>, 기간 <YYYY-MM-DD> ~ <YYYY-MM-DD>, 상태 active, pm owner, hidden false. 이어서 wbs 스킬로 wbs/<이름>.json 공정표를 대단락 <대단락1, 대단락2, …> 로 짜고, 프로젝트 문서의 wbs 필드에 "<이름>" 을 써줘.');
const askTask = () => SANCHO.ask(`db/tasks.json 에 업무를 추가해줘: title <업무명>, projectId ${UI.taskProj ? `"${UI.taskProj}"` : '<프로젝트 id 또는 "">'}, assignee owner, due <YYYY-MM-DD>, priority mid, status todo, source user, memo <메모>`);

function openTask(t) {
  const isNew = !t; t = t || { assignee: me.uid, priority: 'mid', status: 'todo', projectId: UI.taskProj };
  openModal(isNew ? '+ 업무 추가' : '✏ 업무', `
    ${fld('tTitle', '업무명', inp('tTitle', t.title || '', 'text', '예: 후판 입고 검사'))}
    <div class="fg row">${fld('tProj', '프로젝트', sel('tProj', t.projectId || '', [['', '없음'], ...S.projects.filter((p) => !p.hidden || p.id === t.projectId).map((p) => [p.id, `${p.code || ''} ${p.name || ''}`])]))}${fld('tAssignee', '담당자', sel('tAssignee', t.assignee || '', [['', '미지정'], ...userOpts()]))}</div>
    <div class="fg row">${fld('tDue', '마감', inp('tDue', t.due || '', 'date'))}${fld('tPriority', '우선순위', sel('tPriority', t.priority || 'mid', [['high', '높음'], ['mid', '보통'], ['low', '낮음']]))}</div>
    ${isNew ? '' : fld('tStatus', '상태', sel('tStatus', t.status, COLS))}
    ${fld('tMemo', '메모', `<textarea class="ft" id="tMemo">${esc(t.memo || '')}</textarea>`)}`,
  async () => {
    const title = val('tTitle'); if (!title) return toast('업무명을 입력하세요', 'err');
    const data = { title, projectId: val('tProj'), assignee: val('tAssignee'), due: val('tDue'), priority: val('tPriority'), memo: val('tMemo') };
    try { if (isNew) await setDoc(doc(db, 'tasks'), { ...data, status: 'todo', source: 'user' }); else await updateDoc(doc(db, 'tasks', t.id), { ...data, status: val('tStatus') }); closeModal(); toast('저장했어요', 'ok'); } catch (err) { toast(err.message, 'err'); }
  }, isNew ? null : async () => { if (!confirm(`업무 "${t.title}" 을 삭제할까요?`)) return; try { await deleteDoc(doc(db, 'tasks', t.id)); closeModal(); toast('삭제했어요', 'ok'); } catch (err) { toast(err.message, 'err'); } });
}

// ── 이벤트(위임) ──
const root = document.getElementById('root');
root.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const id = el.dataset.id, p = id ? projOf(id) : null;
  switch (el.dataset.act) {
    case 'tab': UI.tab = el.dataset.tab; try { localStorage.pj_tab = UI.tab; } catch {} render(); break;
    case 'filter': UI.filter = el.dataset.v; render(); break;
    case 'toggle-hidden': UI.showHidden = !UI.showHidden; render(); break;
    case 'year': UI.year += Number(el.dataset.d); render(); break;
    case 'new-proj': openProject(null); break;
    case 'edit': openProject(p); break;
    case 'del': delProject(p); break;
    case 'hide': if (p) updateDoc(doc(db, 'projects', p.id), { hidden: !p.hidden }).catch((err) => toast(err.message, 'err')); break;
    case 'mk-wbs': makeWbs(p); break;
    case 'ask-wbs': askWbs(p); break;
    case 'ask-new': askNew(); break;
    case 'ask-task': askTask(); break;
    case 'open': openWbs(p); break;
    case 'new-task': openTask(null); break;
    case 'task-edit': openTask(S.tasks.find((t) => t.id === id)); break;
    case 'okr-open': SANCHO.open('okr', id.split(':')[1]); break;
  }
});
root.addEventListener('change', (e) => { if (e.target.dataset.act === 'task-proj') { UI.taskProj = e.target.value; render(); } });
let dragId = null;   // HTML5 끌어놓기 — 원본 onTaskDragStart/onColDrop
root.addEventListener('dragstart', (e) => { const t = e.target.closest?.('.task[data-id]'); if (!t) return; dragId = t.dataset.id; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch {} t.classList.add('dragging'); });
root.addEventListener('dragend', (e) => { dragId = null; e.target.closest?.('.task')?.classList.remove('dragging'); root.querySelectorAll('.kb-col.drag-over').forEach((c) => c.classList.remove('drag-over')); });
root.addEventListener('dragover', (e) => { const c = e.target.closest?.('.kb-col'); if (!c) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; c.classList.add('drag-over'); });
root.addEventListener('dragleave', (e) => { const c = e.target.closest?.('.kb-col'); if (c && !c.contains(e.relatedTarget)) c.classList.remove('drag-over'); });
root.addEventListener('drop', (e) => { const c = e.target.closest?.('.kb-col'); if (!c) return; e.preventDefault(); c.classList.remove('drag-over'); const id = dragId || e.dataTransfer.getData('text/plain'); if (id) moveTask(id, c.dataset.col); });

// ── 시동: 공정표 목록 먼저(카드 진도율 깜빡임 방지) → onSnapshot 4개 → 20초 주기 ──
async function boot() {
  await loadWbs();
  const sub = (col, after) => onSnapshot(collection(db, col), (s) => { S[col] = s.docs.map((d) => ({ id: d.id, ...d.data() })); after?.(); render(); }, (err) => toast(`${col} 읽기 실패: ${err.message}`, 'err'));
  sub('projects', () => { reconcile(); loadWbs(); }); sub('tasks'); sub('okrs'); sub('users');
  setInterval(loadWbs, 20000);
}
</script></body></html>
