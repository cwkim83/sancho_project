<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>산초 · 결재</title>
<link rel="stylesheet" href="/m/platform.css">
<script src="/m/sdb.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/* 결재 — 세종 플랫폼 v2 index.html 7366-7923 이식(결재선 상태기계·도장칸·3구획 표). 색은 전부 변수·platform.css pill */
.sec { margin-top: 14px; }
.sec h3 .cnt { font-weight: 400; color: var(--text-lighter); font-size: 12px; }
.table td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.table td.ti { font-weight: 600; }
.table tbody tr[data-open] { cursor: pointer; }
.none { text-align: center; padding: 16px; color: var(--text-lighter); font-size: 12px; }
.toolbar .fi { width: 220px; } .toolbar .fs { width: auto; }
/* 결재란(도장칸) */
.stamp { border-collapse: collapse; font-size: 11px; text-align: center; }
.stamp td { border: 1px solid var(--border); padding: 2px 8px; color: var(--text); }
.stamp td.vert { background: var(--bg2); color: var(--text-light); writing-mode: vertical-rl; padding: 4px; }
.stamp td.rl { color: var(--text-light); }
.stamp td.sig { height: 42px; width: 58px; padding: 0; }
.stamp td.dt { font-size: 10px; color: var(--text-lighter); }
.sig .mark { border: 1.5px solid var(--text-light); border-radius: 50%; width: 34px; height: 34px; line-height: 32px; margin: 3px auto; font-size: 11px; }
.sig .mark.ok { border-color: var(--success); color: var(--success); }
.sig .mark.no { border-color: var(--danger); color: var(--danger); }
.sig .wait { color: var(--warning); font-size: 11px; } .sig .none2 { color: var(--text-lighter); font-size: 11px; }
/* 상세 */
.dhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.dhead .tt { font-size: 17px; font-weight: 700; margin-top: 6px; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; font-size: 12.5px; margin-bottom: 12px; }
.kv b { color: var(--text-light); font-weight: 600; }
.sub { font-size: 12px; font-weight: 700; color: var(--text-light); margin: 14px 0 6px; }
.mdbox { background: var(--bg2); border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.65; overflow-x: auto; }
.mdbox :first-child { margin-top: 0; } .mdbox h1, .mdbox h2, .mdbox h3 { font-size: 14px; margin: 12px 0 6px; }
.mdbox p, .mdbox ul, .mdbox ol, .mdbox table { margin: 6px 0; } .mdbox ul, .mdbox ol { padding-left: 20px; }
.mdbox table { border-collapse: collapse; } .mdbox th, .mdbox td { border: 1px solid var(--border); padding: 4px 8px; font-size: 12px; }
.mdbox pre { white-space: pre-wrap; margin: 0; font: inherit; }
.step { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 7px 0; border-bottom: 1px solid var(--border-light); font-size: 13px; }
.step:last-child { border-bottom: 0; } .step .nm { font-weight: 600; } .step .sp { flex: 1; }
.step .note { color: var(--text-light); font-size: 12px; }
.att { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12.5px; border-bottom: 1px solid var(--border-light); }
.att:last-child { border-bottom: 0; } .att .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acts { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; margin-top: 10px; }
.warn { background: var(--bg2); border: 1px solid var(--warning); border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--text-light); margin-top: 12px; }
.lrow { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.lrow .fs { width: auto; } .lrow .who { flex: 1; min-width: 0; }
/* 인쇄용 보기 */
#printbox { display: none; }
@media print {
  body > *:not(#printbox) { display: none !important; }
  #printbox { display: block !important; background: #fff; color: #000; }
  #printbox .phead { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 16px; }
  #printbox .pt { font-size: 21px; font-weight: 800; }
  #printbox .psub { font-size: 12px; color: #444; margin-top: 4px; }
  #printbox .stamp td { border: 1px solid #000; color: #000; background: #fff; }
  #printbox .sig .mark { border-color: #000; color: #000; }
  #printbox .pinfo { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 14px; }
  #printbox .pinfo th { background: #f2f2f2; width: 90px; text-align: left; }
  #printbox .pinfo th, #printbox .pinfo td { border: 1px solid #000; padding: 5px 8px; }
  #printbox .mdbox { background: #fff; border: 1px solid #000; }
  #printbox .mdbox th, #printbox .mdbox td { border: 1px solid #000; }
  @page { margin: 16mm; }
}
@media (max-width: 900px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } .kv { grid-template-columns: 1fr; } }
</style>
</head><body><div class="content-pad" id="root"></div>
<div id="printbox"></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="modal"><div class="modal">
  <div class="modal-head"><div class="modal-title" id="mTitle"></div><button class="btn btn-sm btn-ghost" data-close>✕</button></div>
  <div class="modal-body" id="mBody"></div>
  <div class="modal-foot"><button class="btn" data-close>닫기</button><button class="btn btn-primary" id="mOk">저장</button></div>
</div></div>
<script>
const { db, doc, collection, getDoc, getDocs, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot, query, where, orderBy, limit, writeBatch } = window.fb;
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = (t, kind = '') => { const el = document.getElementById('toast'); el.textContent = t; el.className = 'toast on ' + kind; clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2200); };
window.addEventListener('message', (e) => { if (e.data?.sancho && e.data.act === 'theme') document.documentElement.dataset.theme = e.data.theme || ''; });
let me = null;                                  // 주인(단일 사용자): {uid:'owner', name, title, dept, email}
window.fb.me().then((u) => { me = u; boot(); });

const $ = (s) => document.querySelector(s);
const v = (s) => ($(s) ? $(s).value : '').trim();
const S = { approvals: [], users: [], projects: [], ready: false };   // onSnapshot 이 채운다 — 별도 캐시 없음
const F = { status: '', type: '', range: '', q: '' };                 // 필터(UI 취향, 메모리)
let openId = null, noteDraft = '';                                    // 열려 있는 상세 · 결재 의견 입력값
const Dr = { type: 'general', line: [], files: [] };                  // 기안 모달 임시 상태

// ── 상수 ──
const TYPES = {
  general: { icon: '📄', label: '일반 기안', pill: 'gray', roles: ['검토', '승인'], body: '## 목적\n\n## 내용\n\n## 요청 사항\n' },
  purchase: { icon: '💰', label: '구매·품의', pill: 'orange', amount: true, roles: ['검토', '승인'], body: '## 구매 품목\n\n| 품목 | 규격 | 수량 | 단가 |\n|---|---|---|---|\n|  |  |  |  |\n\n## 구매 사유\n\n## 납기\n' },
  quality: { icon: '🔎', label: '품질', pill: 'purple', roles: ['검토', '검토', '승인'], body: '## 대상\n\n## 검사·부적합 내용\n\n## 조치 계획\n\n## 검증 방법\n' },
  project: { icon: '📊', label: '프로젝트', pill: 'blue', amount: true, roles: ['검토', '승인'], body: '## 프로젝트\n\n## 요청 내용\n\n## 일정·비용 영향\n' },
  'schedule-change': { icon: '📅', label: '일정 변경', pill: 'blue', roles: ['검토', '승인'], body: '## 대상 공정표\n\n## 변경 내용\n\n- 작업 / 기존 → 변경\n\n## 사유\n\n## 후속 영향\n' },
  'okr-change': { icon: '🎯', label: '목표 변경', pill: 'purple', roles: ['승인'], body: '## 대상 목표\n\n## 변경 내용\n\n## 사유\n' },
  leave: { icon: '🌴', label: '휴가', pill: 'green', roles: ['승인'], body: '## 기간\n\n## 사유\n\n## 업무 인계\n' },
  expense: { icon: '🧾', label: '경비', pill: 'orange', amount: true, roles: ['검토', '승인'], body: '## 사용 내역\n\n| 일자 | 항목 | 금액 |\n|---|---|---|\n|  |  |  |\n\n## 사유\n' },
};
const ST = { pending: { pill: 'orange', label: '진행중' }, approved: { pill: 'green', label: '승인완료' }, rejected: { pill: 'red', label: '반려' }, withdrawn: { pill: 'gray', label: '회수' } };
const STEP = { approved: { pill: 'green', icon: '✓', label: '승인' }, rejected: { pill: 'red', icon: '✕', label: '반려' }, skipped: { pill: 'gray', icon: '⤼', label: '전결 생략' }, pending: { pill: 'orange', icon: '⏳', label: '결재 대기' }, waiting: { pill: 'gray', icon: '…', label: '예정' } };

// ── 조회 ──
const uid = () => (me && me.uid) || 'owner';
const TY = (t) => TYPES[t] || { icon: '📄', label: t || '기타', pill: 'gray', roles: ['승인'], body: '' };
const stMeta = (a) => ST[a.status] || ST.pending;
const user = (id) => S.users.find((u) => u.id === id);
const uName = (id) => (user(id) || {}).name || (id === 'owner' ? (me && me.name) || '주인' : id || '-');
const proj = (id) => S.projects.find((p) => p.id === id);
const projLabel = (id) => { const p = proj(id); return p ? `${p.code || ''} ${p.name || ''}`.trim() : ''; };
const lineArr = (a) => Array.isArray(a && a.approvalLine) ? a.approvalLine : [];
const cur = (a) => lineArr(a).find((s) => s.status === 'pending') || null;
const stepName = (s) => s.name || uName(s.userId);
const won = (n) => Number(n) ? '₩' + Number(n).toLocaleString('ko-KR') : '-';
const day = (a) => String(a.createdAt || '').slice(0, 10);
const dt = (iso) => String(iso || '').replace('T', ' ').slice(0, 16);
const today = () => new Date().toLocaleDateString('sv-SE');
const ym = () => today().slice(0, 7);
const pill = (t, c) => `<span class="b-pill ${c || 'gray'}">${esc(t)}</span>`;
const tyPill = (t) => pill(`${TY(t).icon} ${TY(t).label}`, TY(t).pill);
function md(t) { const s = esc(t || ''); try { return window.marked ? window.marked.parse(s, { breaks: true }) : `<pre>${s}</pre>`; } catch (e) { return `<pre>${s}</pre>`; } }

// ── 쓰기 ──
const ref = (id) => doc(db, 'approvals', id);
async function patch(id, data) { try { await updateDoc(ref(id), data); return true; } catch (e) { toast('저장 실패: ' + e.message, 'err'); return false; } }

// ── 산초에게 ──
const FIELDS = `문서 형식은 platform 스킬의 approvals 규격을 그대로 따라줘: title, type('general'|'purchase'|'quality'|'project'|'schedule-change'|'okr-change'|'leave'|'expense'), drafterId "owner", body(마크다운 본문 — 목적·내용·금액 근거·기한을 소제목으로 나눠서), amount(숫자, 없으면 0), due('YYYY-MM-DD' 또는 ''), projectId(db/projects.json 의 문서 id 또는 ''), attachments[], approvalLine[{userId, name, role('검토'|'승인'), status(첫 단계만 'pending' 나머지는 'waiting'), note:'', at:''}] — 결재자는 db/users.json 에서 골라줘, status 'pending', decisionNote:'', decidedAt:'', payload:{}. 파일은 { "<id>": {…} } 한 덩어리 JSON 이고 id 는 짧은 영문·숫자로, 기존 문서는 지우지 말고 새 id 로 추가만 해줘.`;
const askDraftText = () => `산초 데이터 폴더의 db/approvals.json 에 결재 기안서를 새로 써서 추가해줘. 무엇을 올릴지는 나에게 한 번만 물어보고(제목·목적·금액·기한), 답을 받으면 바로 작성해줘. 필요하면 db/projects.json·db/tasks.json·db/mail.json 을 훑어 근거를 채워도 좋아. ${FIELDS} 끝나면 만든 문서의 제목·유형·금액·결재선을 한 줄로 보고해줘.`;
const askFillText = () => `산초 데이터 폴더의 db/approvals.json 에 결재 기안서를 새로 써서 추가해줘. 제목 "${v('#fTitle') || '(제목을 정해줘)'}", 유형 "${Dr.type}"(${TY(Dr.type).label}), 금액 ${v('#fAmount') || '0'}원, 기한 "${v('#fDue') || '미정'}", 프로젝트 "${projLabel(v('#fProject')) || '없음'}". 본문은 이 유형에 맞는 정식 기안서로 마크다운으로 써줘(목적·내용·금액 산출 근거·기한·기대 효과). ${FIELDS} 끝나면 한 줄로 보고해줘.`;
const askWbsText = (a) => `승인된 일정 변경을 공정표에 반영해줘: 결재 문서 "${a.title || ''}"(db/approvals.json 의 ${a.id}) 가 최종 승인됐다. payload 의 wbs "${(a.payload || {}).wbs || ''}" 가 가리키는 data/wbs/<이름>.json 을 열어 payload.changes 의 변경(${JSON.stringify((a.payload || {}).changes || {}).slice(0, 400)})을 그대로 반영해줘. 반영 전에 POST /api/wbs/snapshot 으로 스냅샷을 먼저 뜨고, 바꾼 작업의 이름·기존 날짜·바뀐 날짜를 한 줄씩 보고해줘. 결재 문서 자체는 고치지 마라.`;
const askOkrText = (a) => `승인된 목표 변경을 반영해줘: 결재 문서 "${a.title || ''}"(db/approvals.json 의 ${a.id}) 가 최종 승인됐다. db/okrs.json 의 목표 "${(a.payload || {}).okrId || ''}" 에 다음 변경을 반영해줘 — ${typeof (a.payload || {}).change === 'string' ? (a.payload.change || '') : JSON.stringify((a.payload || {}).change || {})}. 마일스톤·기간·담당 등 어떤 필드를 어떻게 바꿨는지 한 줄로 보고하고, 판단이 어려우면 고치지 말고 물어봐줘.`;

// ── 필터 ──
function filtered() {
  const q = F.q.trim().toLowerCase(), m = ym(), y = today().slice(0, 4);
  const q3 = (() => { const d = new Date(); d.setMonth(d.getMonth() - 3); return d.toLocaleDateString('sv-SE'); })();
  return S.approvals.filter((a) => (!F.status || a.status === F.status) && (!F.type || a.type === F.type)
    && (!F.range || (F.range === 'month' ? day(a).startsWith(m) : F.range === 'q3' ? day(a) >= q3 : day(a).startsWith(y)))
    && (!q || [a.title, a.body, uName(a.drafterId), TY(a.type).label].some((x) => String(x || '').toLowerCase().includes(q))))
    .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
}

// ── 화면 ──
function render() {
  if (!S.ready) return;
  const root = $('#root');
  if (!S.approvals.length) {
    root.innerHTML = head() + `<div class="empty"><h3>올라온 결재가 없습니다</h3>
      구매·품질·일정 변경·휴가 같은 기안을 올리면 결재선을 따라 단계별로 진행됩니다.<br>기안서 작성을 산초에게 맡길 수도 있습니다.
      <div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-primary" data-act="new">+ 신규 기안</button>
        <button class="btn btn-ai" data-act="ai-draft">✳ 산초에게 · 기안서 써줘</button></div></div>`;
    return;
  }
  const f = filtered();
  const todo = f.filter((a) => a.status === 'pending' && cur(a));
  const mine = f.filter((a) => a.drafterId === uid() && a.status === 'pending');
  const done = f.filter((a) => a.status === 'approved' || a.status === 'rejected' || a.status === 'withdrawn');
  const all = S.approvals;
  const kWait = all.filter((a) => a.status === 'pending').length;
  const kTurn = all.filter((a) => a.status === 'pending' && (cur(a) || {}).userId === uid()).length;
  const kMonth = all.filter((a) => a.status === 'approved' && String(a.decidedAt || a.updatedAt || '').slice(0, 7) === ym()).length;
  const kNo = all.filter((a) => a.status === 'rejected').length;
  root.innerHTML = head() + `
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">🕒 대기</div><div class="kpi-value orange">${kWait}</div><div class="kpi-trend">전체 ${all.length}건 중</div></div>
      <div class="kpi"><div class="kpi-label">🔴 내 차례</div><div class="kpi-value${kTurn ? ' red' : ''}">${kTurn}</div><div class="kpi-trend${kTurn ? ' down' : ''}">${kTurn ? '결재를 기다립니다' : '없음'}</div></div>
      <div class="kpi"><div class="kpi-label">✅ 이번 달 승인</div><div class="kpi-value green">${kMonth}</div><div class="kpi-trend">${esc(ym())}</div></div>
      <div class="kpi"><div class="kpi-label">↩ 반려</div><div class="kpi-value gray">${kNo}</div><div class="kpi-trend">누적</div></div>
    </div>
    <div class="toolbar">
      <select class="fs" data-f="status"><option value="">상태 전체</option>${Object.entries(ST).map(([k, s]) => `<option value="${k}"${F.status === k ? ' selected' : ''}>${esc(s.label)}</option>`).join('')}</select>
      <select class="fs" data-f="type"><option value="">유형 전체</option>${Object.entries(TYPES).map(([k, t]) => `<option value="${k}"${F.type === k ? ' selected' : ''}>${t.icon} ${esc(t.label)}</option>`).join('')}</select>
      <select class="fs" data-f="range"><option value="">기간 전체</option><option value="month"${F.range === 'month' ? ' selected' : ''}>이번 달</option><option value="q3"${F.range === 'q3' ? ' selected' : ''}>최근 3개월</option><option value="year"${F.range === 'year' ? ' selected' : ''}>올해</option></select>
      <input class="fi" data-f="q" placeholder="제목 · 본문 · 기안자 검색" value="${esc(F.q)}">
      <span class="sp"></span><span class="fh" style="margin:0">보이는 문서 ${f.length} / 전체 ${all.length}</span>
    </div>
    ${section('🔴 내가 결재할 것', 'var(--danger)', todo, '')}
    ${section('📤 내가 올린 것', 'var(--primary)', mine, 'mine')}
    ${section('📚 완료된 결재', 'var(--text-light)', done.slice(0, 30), 'done', done.length)}`;
  if (openId) renderDetail();
}
function head() {
  return `<div class="mod-head"><div><div class="mod-title">결재</div>
    <div class="mod-sub">기안 · 결재선 단계 진행 · 전결 · 회수 — 문서를 클릭하면 상세가 열립니다</div></div>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-ai" data-act="ai-draft" title="산초가 기안서 본문과 결재선까지 써서 db/approvals.json 에 넣습니다">✳ 산초에게 · 기안서 초안</button>
      <button class="btn btn-primary" data-act="new">+ 신규 기안</button>
    </div></div>`;
}
function section(title, color, rows, mode, total) {

  return `<div class="card sec"><h3 style="color:${color}">${title} <span class="cnt">(${total ?? rows.length})</span></h3>

      ${total && total > rows.length ? `<div class="fh" style="text-align:right">최근 ${rows.length}건만 표시됩니다.</div>` : ''}`
    : `<div class="none">${mode === 'mine' ? '진행 중인 내 기안이 없습니다.' : mode === 'done' ? '완료된 결재가 없습니다.' : '결재할 문서가 없습니다.'}</div>`}</div>`;

    : mode === 'done' ? `<button class="btn btn-sm btn-danger" data-act="del" data-id="${esc(a.id)}">🗑 삭제</button>` : '';

// 결재란(도장칸) — 원본 _renderStampBox
function stampBox(line) {

  const cell = (s) => {
    if (s.status === 'approved') return '<div class="mark ok">승인</div>';
    if (s.status === 'rejected') return '<div class="mark no">반려</div>';
    if (s.status === 'skipped') return '<div class="none2">전결<br>생략</div>';
    if (s.status === 'pending') return '<div class="wait">대기중</div>';
    return '<div class="none2">예정</div>';
  };
  return `<table class="stamp">
    <tr><td class="vert" rowspan="4">결재</td>${line.map((s) => `<td class="rl">${esc(s.role || '승인')}</td>`).join('')}</tr>
    <tr>${line.map((s) => `<td>${esc(stepName(s))}</td>`).join('')}</tr>
    <tr>${line.map((s) => `<td class="sig">${cell(s)}</td>`).join('')}</tr>
    <tr>${line.map((s) => `<td class="dt">${esc(String(s.at || '').slice(5, 10) || '-')}</td>`).join('')}</tr></table>`;
}
function stepList(line) {
  return line.map((s) => { const m = STEP[s.status] || STEP.waiting; return `<div class="step">

}
function attList(files, big) {

// ── 결재 진행 (원본 decideApproval 의 상태기계) ──
async function decide(a, decision) {
  const line = lineArr(a).map((s) => ({ ...s }));
  const i = line.findIndex((s) => s.status === 'pending');
  if (i < 0) return toast('진행 중인 결재 단계가 없습니다.', 'err');
  const now = new Date().toISOString();
  line[i] = { ...line[i], status: decision, at: now, note: noteDraft };
  const p = { approvalLine: line, decisionNote: noteDraft, decidedAt: now };
  let final = false;
  if (decision === 'rejected') p.status = 'rejected';
  else { const nx = line.find((s, j) => j > i && s.status === 'waiting'); if (nx) { nx.status = 'pending'; p.status = 'pending'; } else { p.status = 'approved'; final = true; } }
  if (!await patch(a.id, p)) return;
  noteDraft = '';
  if (decision === 'rejected') toast('반려했습니다 — 기안자에게 표시됩니다', 'err');
  else if (!final) toast(`승인했습니다 · 다음은 ${stepName(line.find((s) => s.status === 'pending') || {})}님 차례입니다`, 'ok');
  else { toast('최종 승인 · 결재가 완결됐습니다', 'ok'); await afterApprove({ ...a, status: 'approved' }); }
}
// 전결 — 남은 중간 단계를 'skipped' 로 남기고 마지막 단계에서 승인
async function jeonGyeol(a) {
  const line = lineArr(a).map((s) => ({ ...s }));
  const last = line.length - 1;
  if (last < 0 || !confirm(`중간 결재 단계를 건너뛰고 바로 승인합니다.\n생략되는 단계는 기록에 '전결 생략'으로 남습니다.\n계속할까요?`)) return;
  line.forEach((s, i) => { if (i < last && (s.status === 'pending' || s.status === 'waiting')) { s.status = 'skipped'; s.at = new Date().toISOString(); s.note = (s.note ? s.note + ' · ' : '') + '전결 승인으로 생략'; } });
  line[last].status = 'pending';
  if (!await patch(a.id, { approvalLine: line })) return;
  await decide({ ...a, approvalLine: line }, 'approved');
}
// 최종 승인 부수효과 — 원본 decideApproval 의 유형별 분기. 자동 반영은 '단순 필드 변경'만, 나머지는 산초에게.
const simpleChange = (c) => !!c && typeof c === 'object' && !Array.isArray(c) && Object.keys(c).length > 0 && Object.values(c).every((x) => x == null || typeof x !== 'object');
async function afterApprove(a) {
  const p = a.payload || {};
  if (a.type === 'schedule-change' && p.wbs) return toast('일정 변경이 승인됐습니다 — 공정표 반영은 상세의 산초 버튼으로 맡기세요', 'ok');
  if (a.type === 'okr-change' && p.okrId) {
    if (!simpleChange(p.change)) return toast('목표 변경이 승인됐습니다 — 반영은 상세의 산초 버튼으로 맡기세요', 'ok');
    try { await updateDoc(doc(db, 'okrs', p.okrId), p.change); toast('승인된 변경을 목표에 반영했습니다', 'ok'); }
    catch (e) { toast('목표 반영 실패: ' + e.message + ' — 산초에게 맡기세요', 'err'); }
  }
}

  return TY(type).roles.map((r) => ({ role: r, userId: r === '승인' ? boss.id : mate.id }));

async function upload(files) {
  for (const f of [...files]) {
    try { const r = await window.SANCHO.api('/api/upload', { method: 'POST', headers: { 'x-name': encodeURIComponent(f.name) }, body: f }); Dr.files.push({ name: f.name, path: r.path, size: f.size }); }
    catch (e) { toast(`${f.name} 올리기 실패: ${e.message}`, 'err'); }
  }
  redrawFiles(); if (Dr.files.length) toast('첨부를 올렸습니다', 'ok');
}
async function saveDraft() {
  const title = v('#fTitle'); if (!title) return toast('제목을 입력하세요.', 'err');
  const line = Dr.line.filter((s) => s.userId);
  if (!line.length) return toast('결재자를 최소 한 명 지정하세요.', 'err');
  try {
    await addDoc(collection(db, 'approvals'), {
      title, type: Dr.type, drafterId: uid(), body: $('#fBody').value, amount: Number(v('#fAmount')) || 0, due: v('#fDue'),
      projectId: v('#fProject'), attachments: Dr.files,
      approvalLine: line.map((s, i) => ({ userId: s.userId, name: uName(s.userId), role: s.role, status: i === 0 ? 'pending' : 'waiting', note: '', at: '' })),
      status: 'pending', decisionNote: '', decidedAt: '', payload: {},
    });
    closeModal(); toast('기안을 올렸습니다', 'ok');
  } catch (e) { toast('저장 실패: ' + e.message, 'err'); }
}

  'up': (_a, i) => { if (i > 0) { [Dr.line[i - 1], Dr.line[i]] = [Dr.line[i], Dr.line[i - 1]]; redrawLine(); } },
  'down': (_a, i) => { if (i < Dr.line.length - 1) { [Dr.line[i + 1], Dr.line[i]] = [Dr.line[i], Dr.line[i + 1]]; redrawLine(); } },
  'unfile': (_a, i) => { Dr.files.splice(i, 1); redrawFiles(); },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (el && el.tagName !== 'SELECT') {
    e.stopPropagation();
    const id = el.dataset.id || openId, a = S.approvals.find((x) => x.id === id);
    const lr = el.closest('.lrow'), att = el.closest('.att');
    const i = el.dataset.i != null ? Number(el.dataset.i) : lr ? Number(lr.dataset.i) : att ? Number(att.querySelector('[data-i]')?.dataset.i) : null;
    return ACT[el.dataset.act] && ACT[el.dataset.act](a, i, el);
  }
  if (e.target.closest('[data-stop]')) return;
  const tr = e.target.closest('tr[data-open]');
  if (tr) { openId = tr.dataset.open; noteDraft = ''; renderDetail(); }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.f) { F[t.dataset.f] = t.value; return render(); }
  const lr = t.closest('.lrow');
  if (lr && Dr.line[lr.dataset.i]) { const s = Dr.line[Number(lr.dataset.i)]; if (t.dataset.act === 'role') s.role = t.value; if (t.dataset.act === 'who') s.userId = t.value; }
});
document.addEventListener('input', (e) => {
  if (e.target.dataset.f === 'q') { F.q = e.target.value; render(); }
  if (e.target.id === 'apNote') noteDraft = e.target.value;
});

// ── 모달 셸 (원본 openModal/closeModal — onOk 없으면 저장 버튼 숨김) ──
let mOnOk = null;
function openModal(title, html, onOk, wide) {
  $('#mTitle').textContent = title; $('#mBody').innerHTML = html; mOnOk = onOk;
  $('#modal .modal').classList.toggle('wide', !!wide);
  $('#mOk').style.display = onOk ? '' : 'none';
  $('#modal').classList.add('active');
  if (onOk) { const f = $('#mBody').querySelector('input,select,textarea'); if (f) f.focus(); }
}
function closeModal() { $('#modal').classList.remove('active'); mOnOk = null; openId = null; noteDraft = ''; }
$('#mOk').onclick = () => mOnOk && mOnOk();
$('#modal').addEventListener('click', (e) => { if (e.target === $('#modal') || e.target.closest('[data-close]')) closeModal(); });
$('#mBody').addEventListener('keydown', (e) => {
  if (e.isComposing) return;
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  e.preventDefault();
  if (e.target.id === 'apNote') return;                 // 결재 의견은 버튼으로 결정한다
  mOnOk && mOnOk();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

async function boot() {
  const docs = (s) => s.docs.map((d) => ({ id: d.id, ...d.data() }));
  onSnapshot(collection(db, 'approvals'), (s) => { S.approvals = docs(s); S.ready = true; render(); }, (e) => toast('결재를 읽지 못했습니다: ' + e.message, 'err'));
  onSnapshot(collection(db, 'users'), (s) => { S.users = docs(s); render(); });
  onSnapshot(collection(db, 'projects'), (s) => { S.projects = docs(s); render(); });
}
</script></body></html>
