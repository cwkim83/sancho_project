<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>산초</title>
<!-- 마크다운 렌더러(표·굵게·코드). 인터넷이 없으면 못 받아오는데, 그땐 아래 md() 가 글자 그대로 보여준다 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  /* Claude 데스크톱 앱의 느낌을 본뜸. 색은 전부 변수 — 밝게/어둡게(자동·수동) 는 변수만 바뀐다 */
  :root{--bg:#faf9f5;--side:#f2f0e9;--text:#1f1e1b;--muted:#77746c;--line:#e4e1d9;--accent:#d97757;--user:#efece4;--codebg:#f8ece8;--code:#a53a2e;--card:#fff;--soft:#f4f2ec;--hover:rgba(0,0,0,.05);--sendbg:#1f1e1b;--sendfg:#fff;--shadow:rgba(0,0,0,.08)}
  @media (prefers-color-scheme: dark){:root:not([data-theme=light]){--bg:#1e1d1a;--side:#252420;--text:#e9e7e0;--muted:#9c9990;--line:#3b3934;--accent:#e08a6d;--user:#2f2d28;--codebg:#3d2b27;--code:#f2a48f;--card:#2a2925;--soft:#34322d;--hover:rgba(255,255,255,.06);--sendbg:#e9e7e0;--sendfg:#1e1d1a;--shadow:rgba(0,0,0,.5)}}
  :root[data-theme=dark]{--bg:#1e1d1a;--side:#252420;--text:#e9e7e0;--muted:#9c9990;--line:#3b3934;--accent:#e08a6d;--user:#2f2d28;--codebg:#3d2b27;--code:#f2a48f;--card:#2a2925;--soft:#34322d;--hover:rgba(255,255,255,.06);--sendbg:#e9e7e0;--sendfg:#1e1d1a;--shadow:rgba(0,0,0,.5)}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;font:15px/1.6 system-ui,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--text)}
  #side{width:270px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .brand{padding:16px 16px 8px;font-weight:600;display:flex;align-items:center;gap:6px}
  .star{color:var(--accent)}
  .newbtn{margin:4px 12px 8px;padding:8px 12px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;text-align:left;cursor:pointer;font:inherit;font-size:14px}
  .newbtn:hover{background:var(--bg)}
  .sbody{flex:1;overflow:auto;padding:0 12px 8px}
  .sec h4{margin:12px 4px 4px;font-size:12px;color:var(--muted);font-weight:600}
  .sub{font-size:11px;color:var(--muted);margin:6px 8px 2px}
  .hint{font-size:12px;color:var(--muted)}
  .item{padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .item>span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .item:hover{background:var(--hover)} .item.active{background:var(--card);box-shadow:0 0 0 1px var(--line)}
  .item .t{font-size:11px;color:var(--muted);flex:none}
  .item .acts{display:none;gap:2px;flex:none} .item:hover .acts{display:flex} .item:hover .t{display:none}
  .item .acts button{border:0;background:transparent;cursor:pointer;font-size:12px;color:var(--muted);padding:0 4px}
  details summary{cursor:pointer;font-size:13px;padding:4px 8px;border-radius:8px;list-style:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  details summary:hover{background:var(--hover)}
  details .body{font-size:12.5px;padding:2px 8px 8px 14px;color:var(--text);opacity:.85} details .body.pre{white-space:pre-wrap}
  details .body p{margin:.3em 0} details .body pre{white-space:pre-wrap;font-size:11.5px}
  .foot{border-top:1px solid var(--line);padding:10px 14px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;position:relative}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c33;margin-right:6px;vertical-align:middle} .dot.ok{background:#2e9e5b}
  .icon{margin-left:auto;border:0;background:transparent;cursor:pointer;font-size:16px;color:var(--muted)}
  main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
  header{height:48px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
  #title{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font:inherit;font-size:12.5px;color:var(--text);cursor:pointer;white-space:nowrap}
  .chip.small{font-weight:400;color:var(--muted);cursor:default} .chip:disabled{opacity:.4;cursor:default}
  #micBtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .led{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2e9e5b;margin-right:5px;vertical-align:middle} .led.busy{background:var(--accent);animation:blink 1s infinite} @keyframes blink{50%{opacity:.25}}
  .running{margin-left:auto;font-weight:400;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .spin{display:inline-block;animation:spin 2s linear infinite;color:var(--accent)} @keyframes spin{to{transform:rotate(360deg)}}
  #log{flex:1;overflow:auto} #col{max-width:780px;margin:0 auto;padding:24px 20px 16px}
  .user{background:var(--user);border-radius:14px;padding:10px 14px;margin:18px 0 14px;white-space:pre-wrap;word-break:break-word}
  .attach{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;white-space:normal}
  .thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:var(--card)}
  .bot{margin:6px 0 10px;word-break:break-word}
  .bot p{margin:.5em 0} .bot h1,.bot h2,.bot h3{font-size:1.05em;margin:1em 0 .4em} .bot ul,.bot ol{padding-left:1.4em;margin:.4em 0} .bot li{margin:.15em 0}
  .bot code{background:var(--codebg);color:var(--code);padding:1px 5px;border-radius:5px;font:.9em ui-monospace,Consolas,monospace}
  .bot pre{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow:auto} .bot pre code{background:none;color:inherit;padding:0}
  .bot table{border-collapse:collapse;margin:.6em 0;font-size:.95em;display:block;overflow-x:auto} .bot th,.bot td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top} .bot th{background:var(--soft)}
  .bot blockquote{border-left:3px solid var(--line);margin:.5em 0;padding:0 .8em;color:var(--muted)}
  .bot a{color:var(--accent)}
  .tool{font:12.5px ui-monospace,Consolas,monospace;color:var(--muted);padding:1px 0 1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tool::before{content:'⏺ ';color:var(--accent)}
  .think{color:var(--muted);font-size:13px;margin:8px 0}
  .card{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 14px;margin:10px 0;font-size:13.5px}
  .card h5{margin:0 0 4px;font-size:13px} .card .f{padding:4px 0;border-top:1px dashed var(--line);font:12.5px ui-monospace,Consolas,monospace;white-space:pre-wrap}
  .card.err{border-color:#c0392b;background:color-mix(in srgb,#c0392b 10%,var(--card))}
  .frow{display:flex;align-items:center;gap:10px;font-family:inherit} .frow .fname{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis} .frow .ico{font-size:20px;width:24px;text-align:center}
  .facts{display:flex;gap:4px;flex:none} .facts button,.facts .btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:2px 8px;font:12px system-ui;cursor:pointer;color:var(--text);text-decoration:none}
  .facts button:hover,.facts .btn:hover{background:var(--bg)}
  .note{font-size:12px;color:var(--muted);margin:4px 0 8px}
  #composerWrap{flex:none;padding:8px 20px 12px}
  #composer{max-width:780px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 10px var(--shadow);padding:10px 12px 8px}
  #composer:focus-within{border-color:var(--muted)} #composer.drag{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
  .files{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px 6px} .files:empty{display:none}
  .fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12.5px;background:var(--bg);max-width:280px}
  .fchip span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis} .fchip button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:0}
  .fchip img{width:40px;height:40px;object-fit:cover;border-radius:6px;cursor:zoom-in}
  textarea{width:100%;border:0;outline:0;resize:none;font:inherit;color:var(--text);background:transparent;max-height:220px;line-height:1.5;padding:4px 4px 8px;display:block}
  .crow{display:flex;align-items:center;justify-content:space-between;gap:8px} .left,.right{display:flex;align-items:center;gap:6px;position:relative}
  .send{width:32px;height:32px;border-radius:50%;border:0;background:var(--sendbg);color:var(--sendfg);font-size:16px;cursor:pointer;display:grid;place-items:center}
  .send:disabled{opacity:.3;cursor:default} .send.stop{background:var(--accent);color:#fff;opacity:1}
  .menu{position:absolute;z-index:10;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px var(--shadow);padding:6px;min-width:230px;display:flex;flex-direction:column;gap:2px;font-size:13.5px}
  .menu[hidden]{display:none}   /* display:flex 가 hidden 속성을 이기지 않게 */
  .menu.up{bottom:calc(100% + 6px);right:0} .menu.upleft{bottom:calc(100% + 6px);left:0}
  #gearMenu{min-width:320px;max-height:75vh;overflow:auto}
  .menu label,.menu button{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:8px;border:0;background:transparent;font:inherit;text-align:left;cursor:pointer;align-items:center;color:var(--text)}
  .menu label:hover,.menu button:hover{background:var(--soft)} .menu .hint{padding:4px 10px} .menu .sub{margin:6px 10px 0}
  .menu input.set,.menu select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:12.5px;background:var(--bg);color:var(--text);margin:2px 4px}
  .eff{padding:8px 10px;min-width:260px} .eff .row{display:flex;justify-content:space-between;align-items:center;gap:10px} .eff .row.hint{padding:0}
  input[type=range]{width:100%;accent-color:var(--muted);margin:10px 0 4px}
  .center{text-align:center;max-width:780px;margin:6px auto 0}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:grid;place-items:center;z-index:50;cursor:zoom-out} #lightbox[hidden]{display:none}
  #lightbox img{max-width:92vw;max-height:92vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  /* 회의록 녹취 패널 */
  #meet{position:fixed;right:20px;bottom:130px;width:380px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px var(--shadow);padding:12px;z-index:20} #meet[hidden]{display:none}
  #meet .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13.5px} #meet textarea{height:170px;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg)} #meet .mbtns{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
  /* 뇌 그래프(파이스 코어) — 헤더 아래 전체를 덮는 층 */
  #hud{position:absolute;top:48px;left:0;right:0;bottom:0;background:var(--bg);z-index:5} #hud[hidden]{display:none}
  #neural{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .hudbar{position:absolute;top:10px;left:16px;right:16px;display:flex;gap:8px;align-items:center;pointer-events:none} .hudbar *{pointer-events:auto}
  .mono{font:11px ui-monospace,Consolas,monospace;letter-spacing:.12em;color:var(--muted);margin-right:auto;pointer-events:none}
  .ninfo{position:absolute;z-index:8;width:min(320px,72vw);padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 28px var(--shadow)} .ninfo.hidden{display:none}
  .ninfo b{display:block;font-size:14px;margin-bottom:4px;word-break:break-all} .ninfo .ni-meta{font:10px ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.04em}
  .ninfo .ni-body{margin-top:8px;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:170px;overflow:auto}
  /* 사이드바 메뉴 (AXroa Executive OS 식 왼쪽 내비) */
  #nav{display:flex;flex-direction:column;gap:2px;padding:4px 8px 8px}
  .navi{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;color:var(--fg);font-size:13.5px;padding:8px 10px;border-radius:9px;cursor:pointer}
  .navi:hover{background:var(--card)} .navi.on{background:var(--accent);color:#fff;font-weight:600}
  .navi .ni{font-size:15px;width:18px;text-align:center}
  /* 메뉴 뷰 — 헤더 아래 전체를 덮는 층(뇌 그래프와 같은 자리) */
  #view{position:absolute;top:48px;left:0;right:0;bottom:0;background:var(--bg);z-index:6;overflow:auto;padding:22px 26px 40px} #view[hidden]{display:none}
  #view .deck{max-width:1040px;margin:0 auto}
  #view .dh{font:11px ui-monospace,Consolas,monospace;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
  #view h2{font-size:26px;margin:2px 0 2px;letter-spacing:-.01em} #view .sub2{color:var(--muted);font-size:13.5px;margin-bottom:18px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px}
  .tile .k{font:10px ui-monospace,Consolas,monospace;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
  .tile .v{font-size:30px;font-weight:650;margin-top:6px;line-height:1} .tile .v small{font-size:13px;font-weight:400;color:var(--muted);margin-left:3px}
  .tile.warn .v{color:#e0a52b} .tile.go .v{color:#2fa46b}
  #view .grp{display:flex;align-items:baseline;gap:8px;margin:20px 0 12px} #view .grp h3{font-size:15px} #view .grp .hint{font-size:12px} #view .grp .sp{margin-left:auto}
  #view .qbtn{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:12.5px;color:var(--fg);cursor:pointer} #view .qbtn:hover{border-color:var(--accent)}
  .depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:26px}
  .dept{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:border-color .15s,transform .1s}
  .dept:hover{border-color:var(--accent);transform:translateY(-1px)} .dept:active{transform:none}
  .dept .top{display:flex;align-items:center;gap:9px} .dept .ico{font-size:20px} .dept .nm{font-weight:600;font-size:14px}
  .dept .role{color:var(--muted);font-size:12px;margin:8px 0 10px;line-height:1.5;min-height:34px}
  .dept .st{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)} .dept .st i{width:7px;height:7px;border-radius:50%;background:#8a94a6;display:inline-block}
  .dept .st.on i{background:#2fa46b;box-shadow:0 0 0 3px rgba(47,164,107,.18)} .dept .st.on{color:#2fa46b}
  .feed{border-left:2px solid var(--line);margin-left:6px;padding-left:18px}
  .feed .row{position:relative;padding:0 0 15px} .feed .row::before{content:'';position:absolute;left:-25px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--bg)}
  .feed .when{font:10px ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.04em} .feed .what{font-size:13px;margin-top:2px;line-height:1.55} .feed .what b{font-weight:600}
  /* 업무 일정 · WBS */
  .wbs{display:flex;flex-direction:column;gap:10px}
  .phase{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .phase>.ph{display:flex;align-items:center;gap:10px;padding:12px 15px;font-weight:600;font-size:14px;border-bottom:1px solid var(--line)}
  .phase .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;max-width:220px} .phase .bar i{display:block;height:100%;background:var(--accent)}
  .phase .pct{font:11px ui-monospace,Consolas,monospace;color:var(--muted);min-width:36px;text-align:right}
  .task{display:flex;align-items:center;gap:10px;padding:9px 15px;font-size:13px;border-top:1px solid var(--line)} .task:first-child{border-top:0}
  .task .cb{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--muted);flex-shrink:0;display:grid;place-items:center;font-size:10px;color:#fff} .task.done .cb{background:#2fa46b;border-color:#2fa46b} .task.done .tt{color:var(--muted);text-decoration:line-through}
  .task .who{margin-left:auto;font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:2px 9px}
  /* 메일 */
  .mlist{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .mrow{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);cursor:pointer} .mrow:hover{background:var(--bg)}
  .mrow .tag{font-size:10px;padding:2px 8px;border-radius:20px;flex-shrink:0;font-weight:600} .mrow .frm{font-weight:600;font-size:13px;min-width:110px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mrow .subj{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1} .mrow .when{font:10px ui-monospace,Consolas,monospace;color:var(--muted);flex-shrink:0}
  .setup{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><span class="star">✳</span> 산초</div>
  <nav id="nav">
    <button class="navi" data-view="dash"><span class="ni">📊</span> 대시보드</button>
    <button class="navi" data-view="wbs"><span class="ni">🗓</span> 업무 일정 · WBS</button>
    <button class="navi" data-view="mail"><span class="ni">📧</span> 메일 확인 · 분류</button>
    <button class="navi" data-view="org"><span class="ni">🏢</span> 조직</button>
    <button class="navi on" data-view="chat"><span class="ni">💬</span> 대화</button>
  </nav>
  <button id="new" class="newbtn">＋ 새 대화</button>
  <div class="sbody">
    <div class="sec"><h4>대화</h4><div id="sessions"></div></div>
    <div class="sec"><h4>예약</h4><div id="sched"></div></div>
    <div class="sec"><h4>알림</h4><div id="journal"></div></div>
    <div class="sec"><h4>스킬</h4><div id="skills"></div></div>
    <div class="sec"><h4>위키</h4><div id="wiki"></div></div>
    <div class="sec"><h4>기억</h4><div id="memory"></div></div>
  </div>
  <div class="foot"><span id="status"></span><button id="gear" class="icon" title="설정">⚙</button>
    <div id="gearMenu" class="menu upleft" hidden>
      <div class="sub">화면</div>
      <select id="theme"><option value="auto">테마: 자동(OS 따라)</option><option value="light">테마: 밝게</option><option value="dark">테마: 어둡게</option></select>
      <div class="sub">음성</div>
      <label>"산초야" 호출 대기 <span class="hint">마이크 항상 켜짐</span> <input type="checkbox" id="wakeOn"></label>
      <label>답 읽어주기 <input type="checkbox" id="ttsOn"></label>
      <button id="meetStart">🎙 회의록 녹취 시작 <span class="hint">끝내면 회의록으로 정리</span></button>

<script>
const $ = (s) => document.querySelector(s);
const col = $('#col'), logEl = $('#log'), input = $('#in'), sendBtn = $('#send'), comp = $('#composer');
let busy = false, pending = [], showAll = false;   // pending: 첨부 대기 File 목록
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
if (window.marked) marked.use({ breaks: true, renderer: { html: (h) => esc(typeof h === 'string' ? h : (h && h.text) || '') } });   // 답에 섞인 날 HTML 은 글자로
const md = (t) => window.marked ? marked.parse(String(t)) : '<p>' + esc(t).replace(/\n/g, '<br>') + '</p>';
const ago = (ts) => { const m = Math.round((Date.now() - new Date(ts)) / 60000); return m < 1 ? '지금' : m < 60 ? m + '분 전' : m < 1440 ? Math.round(m / 60) + '시간 전' : Math.round(m / 1440) + '일 전'; };
const closeMenus = () => document.querySelectorAll('.menu').forEach((x) => { x.hidden = true; });
const 모델명 = { fable: 'Fable 5.1', opus: 'Opus', sonnet: 'Sonnet', haiku: 'Haiku' };
const 노력값 = ['low', 'medium', 'high', 'xhigh', 'max'], 노력명 = ['낮음', '중간', '높음', '매우 높음', '최대'];

// ---- 테마: 자동(OS) / 밝게 / 어둡게 — <html data-theme> 이 진실(뇌 그래프도 이걸 본다) ----
function applyTheme(v) { if (v === 'light' || v === 'dark') document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme; localStorage.sancho_theme = v; $('#theme').value = v; }
applyTheme(localStorage.sancho_theme || 'auto');
$('#theme').onchange = (e) => applyTheme(e.target.value);

// ---- 접속 토큰(밖에서 쓸 때): 모든 API 에 헤더로, 이미지·링크엔 쿼리로 ----
const tok = () => localStorage.sancho_token || '';
const hdr = () => ({ 'content-type': 'application/json', ...(tok() ? { 'x-token': tok() } : {}) });
async function api(path, body, retried) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: hdr(), body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401 && !retried) { const t = prompt('접속 토큰을 입력하세요 (⚙ 설정의 "외부 접속 토큰")'); if (t) { localStorage.sancho_token = t; return api(path, body, true); } }
  return r.json();
}

// ---- 파일: 아이콘 · 미리보기 · 카드 ----
const dl = (p) => '/api/download?path=' + encodeURIComponent(p) + (tok() ? '&token=' + encodeURIComponent(tok()) : '');
const ext = (n) => String(n).split('.').pop().toLowerCase();
const isImg = (n) => /^(png|jpe?g|gif|webp|svg)$/.test(ext(n));
const 볼수있음 = (n) => isImg(n) || /^(pdf|txt|md|csv|json|html)$/.test(ext(n));
const 아이콘 = (n) => ({ xlsx: '📊', xls: '📊', csv: '📊', pptx: '📽️', ppt: '📽️', docx: '📄', doc: '📄', pdf: '📕', md: '📝', txt: '📝', json: '🧾', html: '🌐', zip: '🗜️' }[ext(n)] || '📎');
const 크기 = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : b > 1024 ? Math.round(b / 1024) + ' KB' : b + ' B';

function el(cls, html) { const d = document.createElement('div'); d.className = cls; if (html != null) d.innerHTML = html; col.appendChild(d); logEl.scrollTop = logEl.scrollHeight; return d; }
function addUser(text, files) {
  const d = el('user'); d.textContent = text || '';
  if (files?.length) {
    const a = document.createElement('div'); a.className = 'attach';
    a.innerHTML = files.map((f) => isImg(f.name) ? `<img class="thumb" src="${dl(f.path)}" data-view="${esc(f.path)}" alt="${esc(f.name)}" title="${esc(f.name)}">`
      : `<span class="fchip"><span>${아이콘(f.name)} ${esc(f.name)}</span><button data-open="${esc(f.path)}" title="열기">↗</button></span>`).join('');
    d.appendChild(a); logEl.scrollTop = logEl.scrollHeight;
  }
  return d;
}
const addBot = (t) => el('bot', md(t));
const addTool = (name, inp) => { const d = el('tool'); d.textContent = name + '  ' + (inp || ''); d.title = inp || ''; return d; };
const addCard = (title, rows, err) => el('card' + (err ? ' err' : ''), `<h5>${esc(title)}</h5>` + rows.map((r) => `<div class="f">${esc(r)}</div>`).join(''));
function fileCard(title, files) {   // 두뇌가 만든/고친 파일: 보기(이미지·PDF·글) · 열기(이 PC 기본 앱) · ⬇ 내려받기
  return el('card', `<h5>${esc(title)}</h5>` + files.map((f) => `<div class="f frow">${isImg(f.name) ? `<img class="thumb" src="${dl(f.path)}" data-view="${esc(f.path)}" alt="">` : `<span class="ico">${아이콘(f.name)}</span>`}<span class="fname" title="${esc(f.path)}">${esc(f.name)}</span>${f.size ? `<span class="hint">${크기(f.size)}</span>` : ''}<span class="facts">${볼수있음(f.name) ? `<button data-view="${esc(f.path)}">보기</button>` : ''}<button data-open="${esc(f.path)}">열기</button><a class="btn" href="${dl(f.path)}" download="${esc(f.name)}" title="내려받기">⬇</a></span></div>`).join(''));
}
const lightbox = (src) => { $('#lbimg').src = src; $('#lightbox').hidden = false; };
$('#lightbox').onclick = () => { $('#lightbox').hidden = true; };
col.addEventListener('click', async (e) => {
  const v = e.target.closest('[data-view]')?.dataset.view, o = e.target.closest('[data-open]')?.dataset.open;
  if (v) isImg(v) ? lightbox(dl(v)) : window.open(dl(v), '_blank');
  else if (o) { const r = await api('/api/open', { path: o }); if (r.error) alert(r.error); }
});
const setIf = (node, html) => { if (node.dataset.sig !== html) { node.innerHTML = html; node.dataset.sig = html; } };   // 내용이 같으면 다시 안 그린다(펼친 항목이 접히지 않게)

// ---- 뇌(파이스 코어): 헤더 LED + 🧠 그래프 층. neural.js 는 처음 열 때만 읽는다 ----
let neuralLoaded = false;
function loadNeural() { if (neuralLoaded) return; neuralLoaded = true; const s = document.createElement('script'); s.src = '/neural.js?v=1'; document.body.appendChild(s); }
$('#hudBtn').onclick = () => { const h = $('#hud'); h.hidden = !h.hidden; if (!h.hidden) { loadNeural(); setTimeout(() => window.PAISNeural?.refreshVault?.(), 50); } };
$('#hudClose').onclick = () => { $('#hud').hidden = true; };
$('#hudFit').onclick = () => window.PAISNeural?.fit?.();
function brain(on) { $('#brainLed').classList.toggle('busy', on); $('#brainState').textContent = on ? 'THINKING' : 'CORE ONLINE'; on ? window.PAISNeural?.setActive?.() : window.PAISNeural?.setIdle?.(); }

function updateSend() { sendBtn.disabled = !busy && !input.value.trim() && !pending.length; }
function 버튼(on) { busy = on; sendBtn.classList.toggle('stop', on); sendBtn.textContent = on ? '■' : '↑'; sendBtn.title = on ? '중지 (Esc)' : '전송 (Enter)'; updateSend(); brain(on); }

// ---- 첨부: ＋ 버튼, 끌어다 놓기, 붙여넣기. 이미지는 미리보기, 누르면 크게 ----
function addFiles(list) { for (const f of list || []) if (f) pending.push(f); renderFiles(); }
function renderFiles() {
  $('#files').innerHTML = pending.map((f, i) => `<div class="fchip" title="${esc(f.name)}">${f.type.startsWith('image/') ? `<img src="${f.url || (f.url = URL.createObjectURL(f))}" data-lb="${i}" alt="">` : ''}<span>${f.type.startsWith('image/') ? '' : '📎 '}${esc(f.name)}</span><button data-rm="${i}" title="빼기">✕</button></div>`).join('');
  updateSend();
}
$('#files').onclick = (e) => { const i = e.target.dataset.rm, lb = e.target.dataset.lb; if (i != null) { pending.splice(+i, 1); renderFiles(); } else if (lb != null) lightbox(pending[+lb].url); };
$('#attachBtn').onclick = () => $('#fileIn').click();
$('#fileIn').onchange = (e) => { addFiles([...e.target.files]); e.target.value = ''; };
comp.ondragover = (e) => { e.preventDefault(); comp.classList.add('drag'); };
comp.ondragleave = () => comp.classList.remove('drag');
comp.ondrop = (e) => { e.preventDefault(); comp.classList.remove('drag'); addFiles([...e.dataTransfer.files]); };
input.onpaste = (e) => { const fs = [...(e.clipboardData?.files || [])]; if (fs.length) { e.preventDefault(); addFiles(fs); } };
async function upload(f) {
  const r = await fetch('/api/upload', { method: 'POST', headers: { 'x-name': encodeURIComponent(f.name || 'file'), ...(tok() ? { 'x-token': tok() } : {}) }, body: f });
  const j = await r.json().catch(() => ({})); if (!r.ok || j.error) throw new Error(j.error || '업로드 실패'); return j.path;
}

// ---- 음성: 🎤 눌러 말하기 · "산초야" 호출 대기 · 답 읽어주기 · 🎙 회의록 (브라우저 내장 인식·합성 — Chrome·Edge) ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const prefs = { wake: localStorage.sancho_wake === '1', tts: localStorage.sancho_tts === '1' };
let rec = null, listening = false, wakeRec = null, voiceTurn = false, meet = null, 말하는중 = false;
const 호출어 = /(산초|산쵸|삼초|산처|싼초|산조|산쪼|상초)\s*(야|아|님|씨)?[,!.?~\s]*/, 호출어앞 = new RegExp('^\\s*' + 호출어.source);
const 호출어제거 = (t) => t.replace(호출어앞, '');
// 자연스러운 한국어 목소리 고르기 — 앞에 적힌 것일수록 사람 목소리에 가깝다
const 목소리순위 = [/google.*한국|korean.*google/i, /sunhi|선히/i, /injoon|인준/i, /heami|해미/i];
let 고른목소리 = null;
function 목소리찾기() {
  const ko = speechSynthesis.getVoices().filter((v) => /^ko/i.test(v.lang));
  if (!ko.length) return null;
  for (const 순위 of 목소리순위) { const v = ko.find((x) => 순위.test(x.name)); if (v) return v; }
  return ko.find((v) => !v.localService) || ko[0];
}
if ('speechSynthesis' in window) {
  고른목소리 = 목소리찾기();
  speechSynthesis.onvoiceschanged = () => { 고른목소리 = 목소리찾기(); };
}
// 읽지 말아야 할 것(코드·주소·기호)을 걷어내고 말맛에 맞게 다듬는다
function 읽을글로(text) {
  return text
    .replace(/```[\s\S]*?```/g, ' 코드는 화면을 보세요. ')
    .replace(/`([^`]*)`/g, '$1')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, ' 그림 ')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/https?:\/\/\S+/g, ' 주소는 화면을 보세요. ')
    .replace(/^\s*\|.*\|\s*$/gm, ' ')                       // 표는 읽지 않는다
    .replace(/^\s*[-*+]\s+/gm, '')                          // 목록 기호
    .replace(/^\s*#{1,6}\s*/gm, '')
    .replace(/[#*_>|~]/g, ' ')
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '') // 이모지
    .replace(/([.!?…])\s*/g, '$1 ')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 1500);
}
// 문장 단위로 끊어 읽어야 숨을 쉬고, 긴 글에서 중간에 끊기는 일도 없다.
// 끝났을 때 done() 을 부른다 — 말하는 중에 마이크를 켜면 제 목소리를 제가 받아적는다.
function speak(text, done) {
  let 끝났나 = false, 보험 = null;
  // 크롬은 onend 를 안 쏘고 조용히 끝낼 때가 있다. 그러면 말하는중 이 true 로 굳어
  // "산초야" 가 영영 안 먹는다 — 글자 수로 잰 시간이 지나면 강제로 끝낸다.
  const 끝 = () => { if (끝났나) return; 끝났나 = true; clearTimeout(보험); 말하는중 = false; done && done(); };
  if (!('speechSynthesis' in window) || !text) return 끝();
  speechSynthesis.cancel();
  const 글 = 읽을글로(text);
  if (!글) return 끝();
  const 문장들 = (글.match(/[^.!?…\n]+[.!?…]*/g) || [글]).map((s) => s.trim()).filter(Boolean);
  if (!문장들.length) return 끝();
  말하는중 = true;
  보험 = setTimeout(끝, 3000 + 글.length * 180);   // 한글 한 자 ≈ 0.18초 + 여유
  문장들.forEach((s, i) => {
    const u = new SpeechSynthesisUtterance(i ? ' ' + s : s);   // 문장 사이 한 박자
    u.lang = 'ko-KR';
    if (고른목소리) u.voice = 고른목소리;
    u.rate = 0.98;                                    // 조금 천천히 — 또박또박 들린다
    u.pitch = s.endsWith('?') ? 1.08 : 1;             // 묻는 말은 끝을 살짝 올린다
    u.volume = 1;
    if (i === 문장들.length - 1) { u.onend = 끝; u.onerror = 끝; }
    speechSynthesis.speak(u);
  });
}
function micUI(on) { $('#micBtn').classList.toggle('on', on); $('#micBtn').textContent = on ? '🎤 듣는 중…' : '🎤'; }
function wakeUI() { $('#wakeInd').hidden = !wakeRec; $('#wakeOn').checked = prefs.wake; $('#ttsOn').checked = prefs.tts; }
function 삐() { try { const a = new AudioContext(), o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.value = 0.06; o.start(); o.stop(a.currentTime + 0.12); } catch {} }
// 한 번 듣고, 말이 끊기면 보낸다.
// 침묵 2초: 1.2초는 생각하느라 한 박자 쉬면 말 중간에 잘려 나갔다("어… 그러니까" 뒤가 사라짐).
// 크롬은 아무 말이 없으면 제멋대로 인식을 끝낸다 — 아직 한 마디도 못 들었으면 조용히 다시 켠다.
const 침묵대기 = 2000, 재시도최대 = 3;
function 듣기시작(재시도 = 0) {
  if (!SR || listening || busy || meet) return;
  호출대기중지(); speechSynthesis?.cancel?.(); 말하는중 = false;
  rec = new SR(); rec.lang = 'ko-KR'; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 1;
  let final = '', 들은게있나 = false, timer = null; listening = true; micUI(true);

      <div class="sub2">한 번의 지시를 산초가 부서에 나눠 실행하고, 결과를 여기로 모읍니다.</div>
      <div class="tiles">${tiles.map((t) => `<div class="tile ${t.cls || ''}"><div class="k">${t.k}</div><div class="v">${t.v}<small>${t.u}</small></div></div>`).join('')}</div>
      <div class="grp"><h3>부서</h3><span class="hint">누르면 그 부서에 바로 일을 시킵니다</span></div>
      <div class="depts">${부서.map((d) => { const on = s?.busy && s.busy.includes(d.nm); return `<div class="dept" data-dept="${d.id}"><div class="top"><span class="ico">${d.ico}</span><span class="nm">${d.nm}</span></div><div class="role">${esc(d.role)}</div><div class="st ${on ? 'on' : ''}"><i></i>${on ? '작업 중' : '대기'}</div></div>`; }).join('')}</div>
      <div class="grp"><h3>진행 기록</h3><span class="hint">예약·부서 작업이 끝나면 여기 쌓입니다</span></div>
      <div class="feed">${전체.slice(0, 14).map((e) => `<div class="row"><div class="when">${esc(e.date)}</div><div class="what"><b>${esc(e.head)}</b>${e.body ? ' — ' + esc(e.body.slice(0, 160)) : ''}</div></div>`).join('') || '<div class="row"><div class="what hint">아직 기록이 없어요.</div></div>'}</div>`;
    return;
  }
  if (name === 'org') {
    D.innerHTML = `<div class="dh">산초 · 조직</div><h2>부서</h2>
      <div class="sub2">산초가 비서실장이 되어 일을 부서에 나눕니다. 부서를 누르면 그 부서 일로 지시가 채워집니다.</div>
      <div class="depts">${부서.map((d) => { const on = s?.busy && s.busy.includes(d.nm); return `<div class="dept" data-dept="${d.id}"><div class="top"><span class="ico">${d.ico}</span><span class="nm">${d.nm}</span></div><div class="role">${esc(d.role)}</div><div class="st ${on ? 'on' : ''}"><i></i>${on ? '작업 중' : '대기'}</div></div>`; }).join('')}</div>`;
    return;
  }
  if (name === 'wbs') {
    const w = s?.wbs;
    const 채워넣기 = '새 프로젝트의 WBS(작업 분해 구조)를 짜서 data/wbs.json 에 저장해줘. {project, goal, due, phases:[{name, tasks:[{t, who, due, done}]}]} 형식으로 쓰고, 담당(who)은 개발·문서·조사·비서·품질 중에서 골라줘. 프로젝트 이름과 목표는 지금 말할게: ';
    if (!w || !w.phases?.length) {
      D.innerHTML = `<div class="dh">산초 · 업무 일정</div><h2>업무 일정 · WBS</h2>
        <div class="sub2">할 일을 단계로 쪼개고 담당·진행률을 봅니다.</div>
        <div class="setup">아직 등록된 WBS가 없습니다.<br>아래 버튼을 눌러 프로젝트 이름·목표를 말씀하시면 산초가 짜서 이 화면에 넣습니다.<br><br><button class="qbtn" data-fill="${esc(채워넣기)}">＋ WBS 짜줘</button></div>`;
      return;
    }
    const 전체 = w.phases.flatMap((p) => p.tasks || []), 끝 = 전체.filter((t) => t.done).length;
    const 총pct = 전체.length ? Math.round(끝 / 전체.length * 100) : 0;
    D.innerHTML = `<div class="dh">산초 · 업무 일정</div><h2>${esc(w.project || '업무 일정')} · WBS</h2>
      <div class="sub2">${esc(w.goal || '')}${w.due ? ` · 마감 ${esc(w.due)}` : ''}</div>
      <div class="tiles">
        <div class="tile go"><div class="k">진행률</div><div class="v">${총pct}<small>%</small></div></div>
        <div class="tile"><div class="k">전체 작업</div><div class="v">${전체.length}<small>건</small></div></div>
        <div class="tile go"><div class="k">완료</div><div class="v">${끝}<small>건</small></div></div>
        <div class="tile"><div class="k">남은 작업</div><div class="v">${전체.length - 끝}<small>건</small></div></div>
      </div>
      <div class="grp"><span class="sp"></span><button class="qbtn" data-fill="${esc(채워넣기)}">＋ 새 WBS</button></div>
      <div class="wbs">${w.phases.map((p) => {
        const tasks = p.tasks || [], done = tasks.filter((t) => t.done).length, pct = tasks.length ? Math.round(done / tasks.length * 100) : 0;
        return `<div class="phase"><div class="ph"><span>${esc(p.name)}</span><span class="bar"><i style="width:${pct}%"></i></span><span class="pct">${pct}%</span></div>${tasks.map((t) => `<div class="task ${t.done ? 'done' : ''}"><span class="cb">${t.done ? '✓' : ''}</span><span class="tt">${esc(t.t)}</span>${t.due ? `<span class="who">~${esc(t.due)}</span>` : ''}<span class="who">${esc(t.who || '')}</span></div>`).join('') || '<div class="task"><span class="tt hint">항목이 없어요.</span></div>'}</div>`;
      }).join('')}</div>`;
    return;
  }
  if (name === 'mail') {
    D.innerHTML = `<div class="dh">산초 · 메일</div><h2>메일 확인 · 분류</h2>
      <div class="sub2">받은 메일을 산초가 읽고 중요·보통·광고로 갈라 드립니다.</div>
      <div class="grp"><span class="sp"></span>
        <button class="qbtn" data-fill="네이버 메일 최근 것 확인해줘. tools/mail.js 로 받은편지함을 읽어 목록을 보여줘.">📥 받은 메일</button>
        <button class="qbtn" data-fill="안 읽은 메일만 확인해줘. tools/mail.js unread 로 읽어줘.">● 안 읽은 것</button>
        <button class="qbtn" data-fill="받은 메일을 읽고 중요 / 보통 / 광고·뉴스레터로 분류해서 표로 보여줘. 중요한 건 왜 중요한지 한 줄로 붙여줘. tools/mail.js 를 써.">🏷 분류해줘</button></div>
      <div class="setup">아직 메일 계정을 연결하지 않았습니다.<br>네이버 메일에서 <b>IMAP 사용</b>을 켜고 (2단계 인증 시 <b>앱 비밀번호</b> 발급), 아이디와 비밀번호를 채팅으로 주시면 <b>data/mail.json</b> 에 넣어 바로 읽어 드립니다.<br><br>연결되면 이 자리에 받은 메일이 목록으로 뜨고, 위 버튼으로 분류합니다.</div>`;
    return;
  }
}
$('#viewDeck').addEventListener('click', (e) => {
  const dept = e.target.closest('[data-dept]');
  if (dept) { const d = 부서.find((x) => x.id === dept.dataset.dept); if (d) 지시넣기(d.지시); return; }
  const fill = e.target.closest('[data-fill]');
  if (fill) 지시넣기(fill.dataset.fill);
});

async function refresh() {
  let s;
  try { s = await api('/api/state'); if (s.error) throw new Error(s.error); } catch { $('#status').innerHTML = '<span class="dot"></span>서버 응답 없음 — 재시작 중이면 곧 돌아와요'; return; }
  lastState = s; if (현재뷰 !== 'chat' && !$('#view').hidden) 뷰그리기(현재뷰, s);
  const model = 모델명[s.settings.model] || s.settings.model, ei = Math.max(0, 노력값.indexOf(s.settings.effort));
  $('#modelBtn').textContent = model + ' ▾'; $('#effortBtn').textContent = '노력 ' + 노력명[ei] + ' ▾'; $('#modelChip').textContent = model + ' · ' + 노력명[ei];
  if (document.activeElement !== effIn) { effIn.value = ei; $('#effName').textContent = 노력명[ei]; }
  for (const id of ['allowShell', 'allowHome', 'allowApps', 'allowSelfEdit']) $('#' + id).checked = !!s.settings[id];
  for (const inp of document.querySelectorAll('input.set')) if (document.activeElement !== inp) inp.value = s.settings[inp.dataset.key] || '';
  const perms = [s.settings.allowShell && '명령', s.settings.allowHome && '홈 폴더', s.settings.allowApps && '앱', s.settings.allowSelfEdit && '자기 수정'].filter(Boolean);
  $('#permBtn').textContent = (perms.length ? '권한: ' + perms.join(' · ') : '권한: 기본') + ' ▾';
  $('#status').innerHTML = `<span class="dot ${s.claude.ok ? 'ok' : ''}"></span>${s.claude.ok ? 'Claude Code ' + esc(s.claude.version.replace(' (Claude Code)', '')) : 'Claude Code 없음 — README 참고'}`;
  const run = $('#running'); run.hidden = !s.busy && !s.pendingRestart;
  run.innerHTML = (s.busy ? `<span class="spin">✳</span> 실행 중인 작업 1개 · ${esc(s.busy)}` : '') + (s.pendingRestart ? ' · 일이 끝나면 재시작' : '');
  if (!busy) brain(!!s.busy);   // 예약 작업이 돌 때도 뇌가 깜빡인다
  $('#autoLbl').hidden = !s.canAutostart; $('#autostart').checked = !!s.autostart;
  const cur = s.sessions.find((x) => x.id === s.session);
  $('#title').textContent = cur ? cur.title : '새 대화';
  const pinned = s.sessions.filter((x) => x.pinned), recent = s.sessions.filter((x) => !x.pinned), shown = showAll ? recent : recent.slice(0, 5);
  setIf($('#sessions'), (pinned.length ? '<div class="sub">고정됨</div>' + pinned.map((x) => sessItem(x, s.session)).join('') + '<div class="sub">최근</div>' : '')
    + (shown.map((x) => sessItem(x, s.session)).join('') || empty('아직 없음'))
    + (recent.length > 5 ? `<div class="item" data-more="1"><span class="hint">${showAll ? '접기 ▴' : `더 보기 ${recent.length - 5}개 ▾`}</span></div>` : ''));
  setIf($('#sched'), s.schedules.length
    ? s.schedules.map((j) => `<div class="item" title="${esc(j.prompt)}"><span><b>${esc(j.time)}</b> ${j.repeat === 'once' ? esc(j.date || '한 번') : j.repeat === 'every' ? '감시' : '매일'} · ${esc(j.prompt)}</span><span class="acts"><button data-run="${esc(j.id)}" title="지금 실행">▶</button><button data-del="${esc(j.id)}" title="삭제">✕</button></span></div>`).join('')
    : empty('없음 — 채팅으로 "매일 7시에 …해줘"'));
  const entries = s.journal.flatMap((j) => j.text.split(/\n(?=## )/).filter((x) => x.trim()).map((x) => {
    const lines = x.trim().split('\n'); return { date: j.date, head: lines[0].replace(/^## /, ''), body: lines.slice(1).join('\n').trim() };
  })).reverse().slice(0, 10);
  setIf($('#journal'), entries.length
    ? entries.map((e) => `<details><summary>${esc(e.date.slice(5))} ${esc(e.head)}</summary><div class="body">${md(e.body)}</div></details>`).join('')
    : empty('아직 없음 — 예약이 실행되면 여기 쌓여요'));
  setIf($('#skills'), s.skills.length
    ? s.skills.map((n) => `<details data-file=".claude/skills/${esc(n)}/SKILL.md"><summary>${esc(n)}</summary><div class="body"></div></details>`).join('')
    : empty('아직 없음 — "이거 스킬로 저장해" 또는 "이 URL 의 스킬 가져와"'));
  setIf($('#wiki'), s.wiki.length
    ? s.wiki.map((n) => `<details data-file="wiki/${esc(n)}"><summary>${esc(n.replace(/\.md$/, ''))}</summary><div class="body"></div></details>`).join('')
    : empty('아직 없음 — "조사한 내용 위키에 저장해"'));
  const mem = s.memory.trim();
  setIf($('#memory'), mem ? `<details><summary>${mem.split('\n').filter(Boolean).length}줄 기억하고 있어요</summary><div class="body pre">${esc(mem)}</div></details>` : empty('아직 없음 — "기억해: …"'));
  if (col.dataset.sid !== String(s.session)) {   // 대화가 바뀌었을 때만 다시 그린다(진행 중 화면은 건드리지 않는다)
    col.dataset.sid = String(s.session); col.innerHTML = '';
    for (const h of s.history) { if (h.role === 'user') addUser(h.text, h.files); else { addBot(h.text); if (h.files?.length) fileCard(`파일 ${h.files.length}개`, h.files); } }
    if (!s.history.length) el('note', '무엇을 도와드릴까요? 아래에 말씀하세요.').id = 'empty';
  }
}
refresh();
setInterval(refresh, 10000);
wakeUI(); if (prefs.wake) 호출대기시작();
</script>
